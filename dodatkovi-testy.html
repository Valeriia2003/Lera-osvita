<title>Додаткові тести | Підготовка до НМТ</title>
<style>

        options: ["ліпа", "кінь", "шахи", "дзьоб"], answer: 2,
        explain: "шахи: [ш], [х] перед а, и — тверді. ліпа — [л'], кінь — [н'], дзьоб — [д͡з']." },
      { id: "v2-2-4", type: "single", q: "М’якого приголосного звука НЕМАЄ в слові",
        options: ["ряд", "верба", "сіль", "тінь"], answer: 1,
        explain: "верба: [в], [р], [б] тверді ([р] перед приголосним). ряд — [р'], сіль — [с'], [л'], тінь — [т'], [н']." },
      { id: "v2-2-5", type: "single", q: "Пом’якшений приголосний звук є в слові",
        options: ["фініш", "ніс", "ціль", "сіно"], answer: 0,
        explain: "фініш: губний [ф] перед [і] пом’якшений. У словах ніс, ціль, сіно перед і стоять парні приголосні — вони м’які." },
      { id: "v2-2-6", type: "single", q: "Перед [і] стоїть м’який (а не пом’якшений) приголосний у кожному слові рядка",
        options: ["ліс, кіт, ніс", "ліс, тісто, віл", "діти, кіно, ніс", "ліс, тісто, ніс"], answer: 3,
        explain: "[л'], [т'], [н'] мають тверді пари, тому вони м’які. У словах кіт, віл, кіно [к], [в] перед [і] лише пом’якшені." },
      { id: "v2-2-7", type: "single", q: "Дзвінка пара до звука [с'] —",
        options: ["[с]", "[з']", "[з]", "[ц']"], answer: 1,
        explain: "М’який глухий [с'] має м’яку дзвінку пару [з']. [з] — пара до твердого [с]." },
      { id: "v2-2-8", type: "single", q: "Лише глухі приголосні звуки є в слові",
        options: ["шуба", "сокіл", "степ", "гриб"], answer: 2,
        explain: "степ: [с], [т], [п]. У слові шуба є [б], у слові сокіл — сонорний [л], у слові гриб — [г], [р], [б]." },
      { id: "v2-2-9", type: "single", q: "Лише дзвінкі приголосні звуки є в слові",
        options: ["дуб", "суп", "кит", "шия"], answer: 0,
        explain: "дуб: [д], [б]. У літературній вимові [б] у кінці слова не оглушується. В інших словах є глухі [с], [п], [к], [т], [ш]." },
      { id: "v2-2-10", type: "single", q: "Сонорних приголосних НЕМАЄ в слові",
        options: ["мак", "нора", "лис", "капуста"], answer: 3,
        explain: "капуста: [к], [п], [с], [т] — шумні глухі. В інших словах є сонорні [м], [н], [р], [л]." },
      { id: "v2-2-11", type: "single", q: "Шумний дзвінкий м’який приголосний є в слові",
        options: ["тінь", "люк", "дядько", "сіль"], answer: 2,
        explain: "дядько: [д'] — шумний дзвінкий м’який. тінь, сіль — м’які глухі [т'], [с'] і сонорні; люк — сонорний [л']." },
      { id: "v2-2-12", type: "single", q: "Сонорний твердий приголосний є в кожному слові рядка",
        options: ["лимон, тінь, сіль", "мама, рука, вода", "люк, ряд, ніс", "йод, лінь, ніс"], answer: 1,
        explain: "мама — [м], рука — [р], вода — [в]. У словах тінь, сіль, люк, ряд, ніс, йод, лінь сонорні м’які." },
      { id: "v2-2-13", type: "single", q: "Не має глухої пари звук",
        options: ["[м]", "[ж]", "[б]", "[д͡ж]"], answer: 0,
        explain: "[м] — сонорний, а сонорні глухих пар не мають. [ж] — [ш], [б] — [п], [д͡ж] — [ч]." },
      { id: "v2-2-14", type: "single", q: "Звук [ґ] (а не [г]) вимовляємо в слові",
        options: ["голка", "ґедзь", "гарбуз", "гніздо"], answer: 1,
        explain: "ґедзь — буква ґ позначає задньоязиковий [ґ]. В інших словах гортанний [г]." },
      { id: "v2-2-15", type: "single", q: "Звук [г] відрізняється від [ґ] тим, що",
        options: ["[г] глухий, а [ґ] дзвінкий", "[г] має м’яку пару", "[г] позначаємо буквою ґ", "[г] утворюється в гортані без повного змикання"], answer: 3,
        explain: "[г] — гортанний, його можна тягнути; [ґ] — задньоязиковий проривний. Обидва дзвінкі й тверді." },
      { id: "v2-2-16", type: "single", q: "Звук [д͡ж] —",
        options: ["глухий, твердий", "дзвінкий, м’який", "дзвінкий, шумний, твердий", "сонорний, твердий"], answer: 2,
        explain: "[д͡ж] — один шумний дзвінкий звук, твердий, м’якої пари не має. Глуха пара — [ч]." },
      { id: "v2-2-17", type: "single", q: "НЕПРАВИЛЬНИМ є твердження",
        options: ["Пом’якшених приголосних звуків 10.", "М’яких приголосних звуків 10.", "Сонорних приголосних звуків 9.", "Глухих приголосних звуків 12."], answer: 0,
        explain: "Пом’якшені — не окремі звуки, а варіанти твердих перед [і]; їх не рахують. Решта тверджень правильні." },
      { id: "v2-2-18", type: "single", q: "Звук [р'] у слові «буря» —",
        options: ["сонорний, твердий", "сонорний, м’який", "шумний дзвінкий, м’який", "глухий, м’який"], answer: 1,
        explain: "[р'] перед я м’який; [р] — сонорний." },
      { id: "v2-2-19", type: "match", q: "Установіть відповідність між словом і характеристикою ПЕРШОГО приголосного звука.",
        items: [ { t: "1 жінка", a: 2 }, { t: "2 цукор", a: 0 }, { t: "3 ніс", a: 1 }, { t: "4 зять", a: 3 } ],
        options: ["А шумний глухий, твердий", "Б сонорний, м’який", "В шумний дзвінкий, пом’якшений", "Г шумний дзвінкий, м’який", "Д сонорний, твердий"],
        explain: "жінка — [ж] перед [і] пом’якшений; цукор — [ц] твердий глухий; ніс — [н'] сонорний м’який; зять — [з'] шумний дзвінкий м’який." },
      { id: "v2-2-20", type: "match", q: "Установіть відповідність між звуком і його парою за дзвінкістю — глухістю.",
        items: [ { t: "1 [д']", a: 2 }, { t: "2 [ч]", a: 3 }, { t: "3 [ґ]", a: 0 }, { t: "4 [з]", a: 1 } ],
        options: ["А [к]", "Б [с]", "В [т']", "Г [д͡ж]", "Д [т]"],
        explain: "[д'] — [т'] (м’який до м’якого), [ч] — [д͡ж], [ґ] — [к], [з] — [с]." }
    ]
  }
];
</script>

<script>
(function () {
  "use strict";
  var TESTS = window.TESTS, KEY = "fgo-nmt-extra-v2", L = ["А", "Б", "В", "Г", "Д"];
  var app = document.getElementById("app"), timerId = null, mem = null;

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return mem || {}; } }
  function store(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { mem = s; } }
  var S = load(); S.log = S.log || {};
  function fmt(s) { return String(s).replace(/`/g, "́"); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
  function mmss(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s; }
  function dt(ts) { return new Date(ts).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
  function maxOf(q) { return q.type === "match" ? q.items.length : 1; }
  function scoreOf(q, a) {
    if (q.type === "match") { var c = 0; q.items.forEach(function (it, i) { if (a && a[i] === it.a) c++; }); return c; }
    return a === q.answer ? 1 : 0;
  }
  function answered(q, a) {
    if (a === undefined || a === null) return false;
    if (q.type === "match") return q.items.every(function (_, i) { return a[i] !== undefined && a[i] !== null; });
    return true;
  }
  function optText(q, j) { return q.type === "match" ? q.options[j] : L[j] + " " + q.options[j]; }
  function best(id) { var l = S.log[id] || []; return l.length ? Math.max.apply(null, l.map(function (r) { return r.percent; })) : null; }

  function applyTheme() {
    var t = S.theme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
  }
  function header() {
    var h = document.getElementById("topbar");
    h.innerHTML = "<div class='topbar-in'><a class='brand' href='#/'>Додаткові тести · варіант 2<small>Фонетика. Графіка. Орфоепія — підготовка до НМТ</small></a>" +
      "<button class='btn theme-btn' data-theme-toggle aria-label='Перемкнути світлу або темну тему'>" + (document.documentElement.getAttribute("data-theme") === "dark" ? "☀ Світла" : "☾ Темна") + "</button></div>";
    h.querySelector("[data-theme-toggle]").onclick = function () {
      S.theme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"; store(S); applyTheme(); header();
    };
  }

  function viewHome() {
    var html = "<div class='card'><h1>Додаткові тести, варіант 2</h1><p>Окремий варіант тестів до кожного уроку курсу. Запитання не повторюють тести з основного курсу. У кожного тесту є таймер, після завершення ви побачите правильні відповіді й пояснення.</p></div>";
    TESTS.forEach(function (t) {
      var n = (S.log[t.id] || []).length, b = best(t.id);
      html += "<div class='card lesson-item'><div class='lesson-num'>" + t.lesson + "</div><div><h2>Урок " + t.lesson + ". " + esc(t.lessonTitle) + "</h2>" +
        "<p class='muted small'>" + t.questions.length + " завдань · " + t.minutes + " хв · спроб: " + n + (b !== null ? " · найкращий результат: <b>" + b + "%</b>" : "") + "</p>" +
        "<a class='btn acc' href='#/test/" + t.id + "'>" + (n ? "Пройти ще раз" : "Почати тест") + "</a></div></div>";
    });
    app.innerHTML = html;
  }

  function viewTest(t) {
    var st = { cur: 0, ans: {}, start: Date.now(), done: false };
    var limit = t.minutes * 60;
    function tick() {
      var left = limit - (Date.now() - st.start) / 1000, el = document.getElementById("tm");
      if (el) { el.textContent = "⏱ " + mmss(left); el.className = "timer" + (left < 60 ? " low" : ""); }
      if (left <= 0) finish(true);
    }
    function render() {
      var q = t.questions[st.cur], a = st.ans[q.id];
      var nav = t.questions.map(function (qq, i) {
        return "<button data-i='" + i + "' class='" + (answered(qq, st.ans[qq.id]) ? "ans " : "") + (i === st.cur ? "cur" : "") + "' aria-label='Завдання " + (i + 1) + "'>" + (i + 1) + "</button>";
      }).join("");
      var body;
      if (q.type === "match") {
        body = "<p class='small muted'>Варіанти: " + q.options.map(function (o) { return esc(fmt(o)); }).join("; ") + "</p>" + q.items.map(function (it, i) {
          var v = a && a[i] !== undefined && a[i] !== null ? a[i] : "";
          return "<div class='row'><span class='lbl'>" + esc(fmt(it.t)) + "</span><select data-k='" + i + "' aria-label='" + esc(it.t) + "'><option value=''>—</option>" +
            q.options.map(function (o, j) { return "<option value='" + j + "'" + (v === j ? " selected" : "") + ">" + L[j] + "</option>"; }).join("") + "</select></div>";
        }).join("");
      } else {
        body = q.options.map(function (o, j) {
          return "<label class='opt'><input type='radio' name='q' value='" + j + "'" + (a === j ? " checked" : "") + "><span>" + esc(fmt(optText(q, j))) + "</span></label>";
        }).join("");
      }
      app.innerHTML = "<p><a href='#/'>← Усі тести</a></p><div class='card'><h1>" + esc(t.title) + "</h1>" +
        "<div class='test-top'><span class='timer' id='tm'></span><span class='muted' id='cnt'></span></div>" +
        "<div class='qnav'>" + nav + "</div></div>" +
        "<div class='card'><span class='pill'>Завдання " + (st.cur + 1) + " з " + t.questions.length + "</span><p class='q'>" + esc(fmt(q.q)) + "</p>" + body +
        "<div class='btn-row'><button class='btn sec' id='prev'" + (st.cur === 0 ? " disabled" : "") + ">← Назад</button>" +
        (st.cur < t.questions.length - 1 ? "<button class='btn' id='next'>Далі →</button>" : "") +
        "<button class='btn acc' id='fin'>Завершити тест</button></div></div>";
      Array.prototype.forEach.call(app.querySelectorAll("input[type=radio]"), function (r) { r.onchange = function () { st.ans[q.id] = Number(r.value); refresh(); }; });
      Array.prototype.forEach.call(app.querySelectorAll("select"), function (s) {
        s.onchange = function () { var x = st.ans[q.id] || {}; x[Number(s.dataset.k)] = s.value === "" ? null : Number(s.value); st.ans[q.id] = x; refresh(); };
      });
      Array.prototype.forEach.call(app.querySelectorAll(".qnav button"), function (b) { b.onclick = function () { st.cur = Number(b.dataset.i); render(); }; });
      document.getElementById("prev").onclick = function () { if (st.cur > 0) { st.cur--; render(); } };
      var nx = document.getElementById("next"); if (nx) nx.onclick = function () { st.cur++; render(); };
      document.getElementById("fin").onclick = function () {
        var left = t.questions.length - t.questions.filter(function (qq) { return answered(qq, st.ans[qq.id]); }).length;
        if (left && !confirm("Без відповіді залишилось завдань: " + left + ". Завершити тест?")) return;
        finish(false);
      };
      refresh(); tick();
    }
    function refresh() {
      var done = t.questions.filter(function (qq) { return answered(qq, st.ans[qq.id]); }).length;
      var c = document.getElementById("cnt"); if (c) c.textContent = "Відповідей: " + done + " з " + t.questions.length;
      Array.prototype.forEach.call(app.querySelectorAll(".qnav button"), function (b, i) {
        b.classList.toggle("ans", answered(t.questions[i], st.ans[t.questions[i].id]));
      });
    }
    function finish(timeUp) {
      if (st.done) return; st.done = true;
      clearInterval(timerId); timerId = null;
      var score = 0, max = 0, dur = Math.min(limit, Math.round((Date.now() - st.start) / 1000));
      t.questions.forEach(function (q) { score += scoreOf(q, st.ans[q.id]); max += maxOf(q); });
      var percent = Math.round(score / max * 100);
      (S.log[t.id] = S.log[t.id] || []).push({ ts: Date.now(), score: score, max: max, percent: percent, duration: dur });
      store(S);
      var rev = t.questions.map(function (q, i) {
        var a = st.ans[q.id], sc = scoreOf(q, a), ok = sc === maxOf(q), yours, right;
        if (q.type === "match") {
          yours = q.items.map(function (it, k) { return esc(fmt(it.t)) + " → " + (a && a[k] !== undefined && a[k] !== null ? esc(fmt(q.options[a[k]])) : "немає відповіді"); }).join("<br>");
          right = q.items.map(function (it) { return esc(fmt(it.t)) + " → " + esc(fmt(q.options[it.a])); }).join("<br>");
        } else {
          yours = a === undefined || a === null ? "немає відповіді" : esc(fmt(optText(q, a)));
          right = esc(fmt(optText(q, q.answer)));
        }
        return "<div class='review-item " + (ok ? "ok" : "bad") + "'><b>" + (i + 1) + ". " + esc(fmt(q.q)) + "</b> <span class='small muted'>(" + sc + "/" + maxOf(q) + ")</span>" +
          "<p class='small'>Ваша відповідь: " + yours + "</p>" + (ok ? "" : "<p class='small'>Правильна відповідь: " + right + "</p>") +
          "<p class='small muted'>" + esc(fmt(q.explain)) + "</p></div>";
      }).join("");
      var hist = S.log[t.id].slice().reverse().map(function (r, i, arr) {
        return "<tr><td>" + (arr.length - i) + "</td><td>" + dt(r.ts) + "</td><td>" + r.score + "/" + r.max + "</td><td>" + r.percent + "%</td><td>" + mmss(r.duration) + "</td></tr>";
      }).join("");
      app.innerHTML = "<p><a href='#/'>← Усі тести</a></p><div class='card'><h1>" + esc(t.title) + "</h1>" + (timeUp ? "<p><b>Час вичерпано.</b></p>" : "") +
        "<div class='score-big'>" + score + " / " + max + "</div><p>Результат: <b>" + percent + "%</b> · час: " + mmss(dur) + "</p>" +
        "<div class='btn-row'><a class='btn acc' href='#/test/" + t.id + "?r=" + Date.now() + "'>Пройти ще раз</a><a class='btn sec' href='#/'>До списку тестів</a></div></div>" +
        "<div class='card'><h2>Відповіді та пояснення</h2>" + rev + "</div>" +
        "<div class='card'><h2>Журнал спроб</h2><div class='table-wrap'><table><thead><tr><th>№</th><th>Дата</th><th>Бали</th><th>%</th><th>Час</th></tr></thead><tbody>" + hist + "</tbody></table></div>" +
        "<button class='btn danger' id='clr'>Очистити журнал цього тесту</button></div>";
      document.getElementById("clr").onclick = function () { if (confirm("Видалити всі спроби цього тесту?")) { S.log[t.id] = []; store(S); location.hash = "#/"; } };
      window.scrollTo(0, 0);
    }
    render();
    timerId = setInterval(tick, 1000);
  }

  function route() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    applyTheme(); header();
    var m = location.hash.match(/^#\/test\/([\w-]+)/);
    var t = m && TESTS.filter(function (x) { return x.id === m[1]; })[0];
    if (t) viewTest(t); else viewHome();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
