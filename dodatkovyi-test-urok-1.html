<!DOCTYPE html>
<html lang='uk'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Додатковий тест. Урок 1: Український алфавіт. Голосні звуки</title><style>body{margin:0;background:#f3f6fa;color:#1b2433;font-family:'Segoe UI','Noto Sans',Arial,sans-serif;font-size:17px;line-height:1.55}#app{max-width:860px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid #d9e1ea;border-radius:12px;padding:18px;margin-bottom:16px}h1{color:#123a6b;font-size:1.5rem}h2{color:#123a6b;font-size:1.2rem}.muted{color:#5b6678}.big{font-size:2rem;font-weight:800;color:#123a6b}.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:9px;border:1px solid #123a6b;background:#123a6b;color:#fff;cursor:pointer;min-height:42px}.btn.sec{background:#fff;color:#123a6b}.btn.danger{background:#fff;color:#c0392b;border-color:#c0392b}.btn[disabled]{opacity:.5}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.row .lbl{flex:1 1 240px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.timer{font-weight:700;background:#eef3f8;padding:4px 12px;border-radius:8px;font-variant-numeric:tabular-nums}.timer.low{color:#c0392b}.qnav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.qnav button{width:40px;height:40px;border-radius:8px;border:1px solid #d9e1ea;background:#fff;font:inherit;font-weight:600;cursor:pointer}.qnav button.ans{background:#e1f5f4;border-color:#14a3a0}.qnav button.cur{outline:3px solid #1d5394}.opt{display:flex;gap:10px;padding:8px 10px;border:1px solid #d9e1ea;border-radius:8px;margin:6px 0;cursor:pointer}.opt input{width:18px;height:18px;margin-top:4px}.q{font-weight:600}select,input[type=text]{font:inherit;padding:7px 10px;border:1px solid #d9e1ea;border-radius:8px;min-height:40px;max-width:100%}.rev{border:1px solid #d9e1ea;border-radius:10px;padding:10px 14px;margin:10px 0}.rev.ok{border-left:5px solid #1f8a4c}.rev.bad{border-left:5px solid #c0392b}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d9e1ea;padding:6px 8px;text-align:left}th{background:#eef3f8}:focus-visible{outline:3px solid #14a3a0;outline-offset:2px}sup{font-size:.7em}</style></head><body><main id='app'></main><script>window.__TEST={"id":"l1-extra","title":"Додатковий тест. Урок 1: Український алфавіт. Голосні звуки","minutes":25,"questions":[{"id":"u1-x1","type":"single","rule":"r1_2","q":"Скільки букв алфавіту позначають приголосні звуки?","options":["А 22","Б 32","В 23","Г 10"],"answer":0,"explain":"33 букви мінус 10 для голосних і мінус ь — 22."},{"id":"u1-x2","type":"single","rule":"r1_5","q":"Скільки голосних звуків в українській мові?","options":["А 5","Б 6","В 10","Г 33"],"answer":1,"explain":"[а], [е], [и], [і], [о], [у] — шість."},{"id":"u1-x21","type":"single","rule":"r1_4","q":"Букв більше, ніж звуків, у кожному слові рядка","options":["А дзвін, тінь, джем","Б дзвін, щит, джем","В мова, тінь, джем","Г дзвін, тінь, їжа"],"answer":0,"explain":"дзвін (5 букв, 4 звуки), тінь (4 і 3), джем (4 і 3). У словах щит та їжа звуків більше, у слові мова порівну."},{"id":"u1-x4","type":"single","rule":"r1_2","q":"Назву букви записано НЕПРАВИЛЬНО в рядку","options":["А Й — йот","Б Ґ — ґе","В Ч — че","Г Ф — фе"],"answer":3,"explain":"Букву Ф називаємо «еф»."},{"id":"u1-x22","type":"single","rule":"r1_4","q":"Два звуки позначає буквосполучення дж у слові","options":["А джерело","Б бджола","В віджити","Г джміль"],"answer":2,"explain":"від-жити: д належить до префікса, ж — до кореня. В інших словах дж стоїть у корені й позначає один звук."},{"id":"u1-x6","type":"single","rule":"r1_3","q":"Першим в алфавітному списку буде слово","options":["А цибуля","Б чапля","В хата","Г шапка"],"answer":2,"explain":"Порядок букв: х → ц → ч → ш."},{"id":"u1-x23","type":"single","rule":"r1_3","q":"За алфавітом розміщено слова в рядку","options":["А небо, ніч, новина","Б ніч, небо, новина","В небо, новина, ніч","Г новина, небо, ніч"],"answer":0,"explain":"Друга буква: е, і, о."},{"id":"u1-x8","type":"single","rule":"r1_3","q":"Останнім в алфавітному списку буде слово","options":["А юність","Б яблуко","В щастя","Г ящірка"],"answer":3,"explain":"Слова на я стоять у кінці. «Яблуко» та «ящірка»: б раніше за щ."},{"id":"u1-x25","type":"single","rule":"r1_5","q":"Голосний звук [а] є в кожному слові рядка","options":["А яма, мрія, мак","Б яма, юшка, мак","В єнот, мрія, мак","Г яма, мрія, ліс"],"answer":0,"explain":"У буквах а та я міститься голосний [а]: яма, мрія, мак."},{"id":"u1-x24","type":"single","rule":"r1_4","q":"Однакова кількість звуків і букв у кожному слові рядка","options":["А ранок, вікно, дорога","Б ранок, кінь, дорога","В ранок, вікно, щока","Г джерело, вікно, дорога"],"answer":0,"explain":"У словах ранок, вікно, дорога кожна буква позначає один звук. Кінь і джерело мають більше букв, щока — більше звуків."},{"id":"u1-x11","type":"single","rule":"r1_4","q":"Звуків і букв порівну в слові","options":["А вітер","Б тінь","В щока","Г їжа"],"answer":0,"explain":"вітер: 5 букв і 5 звуків. У слові тінь звуків менше, у словах щока та їжа більше."},{"id":"u1-x12","type":"single","rule":"r1_4","q":"Букв більше, ніж звуків, у слові","options":["А сон","Б щит","В сіль","Г їжак"],"answer":2,"explain":"сіль: 4 букви, 3 звуки."},{"id":"u1-x13","type":"single","rule":"r1_4","q":"Правильним є твердження","options":["А Буква ь позначає м’який звук.","Б Буква щ позначає два звуки.","В Звуків у мові менше, ніж букв.","Г Буква ї позначає один звук."],"answer":1,"explain":"Щ = [шч]. Ь звука не позначає, звуків 38 проти 33 букв, ї завжди позначає два звуки."},{"id":"u1-x14","type":"single","rule":"r1_5","q":"Голосний звук [у] є в слові","options":["А юшка","Б яма","В єнот","Г їжа"],"answer":0,"explain":"У букві ю міститься голосний [у]."},{"id":"u1-x15","type":"single","rule":"r1_5","q":"Той самий голосний звук можуть позначати букви","options":["А а та я","Б и та і","В е та и","Г о та у"],"answer":0,"explain":"І а, і я містять голосний [а]: мак, м’ята."},{"id":"u1-x16","type":"single","rule":"r1_5","q":"Скільки складів у слові «українець»?","options":["А 3","Б 4","В 5","Г 6"],"answer":1,"explain":"У-кра-ї-нець: чотири голосні звуки."},{"id":"u1-x17","type":"single","rule":"r1_7","q":"Ненаголошений [и] наближається до [е] в слові","options":["А живе`","Б рис","В дим","Г си`ла"],"answer":0,"explain":"У слові живе` звук [и] стоїть у ненаголошеному складі."},{"id":"u1-x18","type":"single","rule":"r1_7","q":"Ненаголошений [о] наближається до [у] в слові","options":["А коро`ва","Б соло`ма","В розу`мний","Г голова`"],"answer":2,"explain":"розу`мний: [о] стоїть перед складом із наголошеним [у]."},{"id":"u1-x19","type":"single","rule":"r1_7","q":"Чітко вимовляється ненаголошений голосний у слові","options":["А село`","Б зима`","В рука`","Г весна`"],"answer":2,"explain":"Звук [у] чіткий у будь-якій позиції."},{"id":"u1-x20","type":"single","rule":"r1_7","q":"Наближення ненаголошених голосних у вимові","options":["А позначають на письмі іншою буквою","Б не впливає на написання слова","В властиве наголошеним складам","Г стосується лише звука [а]"],"answer":1,"explain":"Це явище вимови. Написання слова лишається тим самим."}]};(function standaloneMain() {
  "use strict";
  var T = window.__TEST;
  var T0 = T.questions.slice();
  var KEY = "fgo-standalone-" + T.id;
  var root = document.getElementById("app");
  var timerId = null;
  function fmt(s) { return String(s).replace(/`/g, "́"); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
  function getLog() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return window.__mem || []; } }
  function setLog(l) { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) { window.__mem = l; } }
  function mmss(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s; }
  function maxOf(q) { return q.type === "match" ? q.items.length : 1; }
  function scoreOf(q, a) {
    if (q.type === "match") { var c = 0; q.items.forEach(function (it, i) { if (a && a[i] === it.a) c++; }); return c; }
    return a === q.answer ? 1 : 0;
  }
  function answered(q, a) {
    if (a === undefined || a === null) return false;
    if (q.type === "match") { return q.items.every(function (_, i) { return a[i] !== undefined && a[i] !== null; }); }
    return true;
  }
  var st = { phase: "intro", cur: 0, ans: {}, start: 0, left: T.minutes * 60, name: "" };

  function intro() {
    var log = getLog();
    var rows = log.slice().reverse().map(function (r) {
      return "<tr><td>" + esc(new Date(r.ts).toLocaleString("uk-UA")) + "</td><td>" + esc(r.name || "—") + "</td><td>" + r.score + " / " + r.max + "</td><td>" + r.percent + "%</td><td>" + mmss(r.dur) + "</td></tr>";
    }).join("");
    root.innerHTML = "<div class='card'><h1>" + esc(T.title) + "</h1>" +
      "<p>Кількість завдань: <b>" + T.questions.length + "</b>. Час: <b>" + T.minutes + " хв</b>. Завдання з однією правильною відповіддю оцінюються 1 балом, завдання на відповідність — 1 бал за кожну правильну пару.</p>" +
      "<p class='muted'>Авторський навчальний тест для підготовки до НМТ. Це не офіційні завдання НМТ.</p>" +
      "<label>Ім’я учениці: <input id='nm' type='text' value='" + esc(localStorage.getItem(KEY + "-name") || "") + "'></label>" +
      "<div class='row'><button class='btn' id='go'>Розпочати тест</button></div></div>" +
      "<div class='card'><h2>Журнал результатів</h2>" + (rows ? "<table><thead><tr><th>Дата</th><th>Учениця</th><th>Бали</th><th>%</th><th>Час</th></tr></thead><tbody>" + rows + "</tbody></table><div class='row'><button class='btn sec' id='clr'>Очистити журнал</button></div>" : "<p class='muted'>Спроб ще немає.</p>") + "</div>";
    document.getElementById("go").onclick = function () {
      st.name = document.getElementById("nm").value.trim();
      try { localStorage.setItem(KEY + "-name", st.name); } catch (e) {}
      st.phase = "run"; st.cur = 0; st.ans = {}; st.start = Date.now(); st.left = T.minutes * 60;
      var L = ["А", "Б", "В", "Г", "Д"];
      T.questions = T0.map(function (q) {
        if (q.type !== "single") return q;
        var perm = q.options.map(function (_, i) { return i; });
        for (var i = perm.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
        var lt = q.options.every(function (o) { return /^[А-Д] /.test(o); });
        var c = JSON.parse(JSON.stringify(q));
        c.options = perm.map(function (pi, k) { var o = q.options[pi]; return lt ? L[k] + " " + o.slice(2) : o; });
        c.answer = perm.indexOf(q.answer);
        return c;
      });
      clearInterval(timerId);
      timerId = setInterval(function () {
        st.left = T.minutes * 60 - (Date.now() - st.start) / 1000;
        var t = document.getElementById("tm"); if (t) { t.textContent = mmss(st.left); t.className = "timer" + (st.left < 60 ? " low" : ""); }
        if (st.left <= 0) finish(true);
      }, 500);
      run();
    };
    var c = document.getElementById("clr");
    if (c) c.onclick = function () { if (confirm("Очистити журнал результатів у цьому файлі?")) { setLog([]); intro(); } };
  }

  function run() {
    var q = T.questions[st.cur];
    var done = T.questions.filter(function (qq) { return answered(qq, st.ans[qq.id]); }).length;
    var nav = T.questions.map(function (qq, i) {
      return "<button data-i='" + i + "' class='" + (answered(qq, st.ans[qq.id]) ? "ans " : "") + (i === st.cur ? "cur" : "") + "' aria-label='Завдання " + (i + 1) + "'>" + (i + 1) + "</button>";
    }).join("");
    var body = "";
    if (q.type === "match") {
      var a = st.ans[q.id] || {};
      body = q.items.map(function (it, i) {
        return "<div class='row'><span class='lbl'>" + fmt(it.t) + "</span><select data-k='" + i + "'><option value=''>— оберіть —</option>" +
          q.options.map(function (o, j) { return "<option value='" + j + "'" + (a[i] === j ? " selected" : "") + ">" + fmt(o) + "</option>"; }).join("") + "</select></div>";
      }).join("");
    } else {
      body = q.options.map(function (o, j) {
        return "<label class='opt'><input type='radio' name='q' value='" + j + "'" + (st.ans[q.id] === j ? " checked" : "") + "> <span>" + fmt(o) + "</span></label>";
      }).join("");
    }
    root.innerHTML = "<div class='card'><div class='top'><span id='tm' class='timer'>" + mmss(st.left) + "</span><span>Виконано: <b>" + done + "</b> з " + T.questions.length + "</span><button class='btn danger' id='fin'>Завершити тест</button></div>" +
      "<div class='qnav'>" + nav + "</div>" +
      "<h2>Завдання " + (st.cur + 1) + "</h2><p class='q'>" + fmt(q.q) + "</p>" + body +
      "<div class='row'><button class='btn sec' id='prev'" + (st.cur === 0 ? " disabled" : "") + ">← Попереднє</button><button class='btn sec' id='next'" + (st.cur === T.questions.length - 1 ? " disabled" : "") + ">Наступне →</button></div></div>";
    Array.prototype.forEach.call(root.querySelectorAll("input[type=radio]"), function (r) {
      r.onchange = function () { st.ans[q.id] = Number(r.value); refreshNav(); };
    });
    Array.prototype.forEach.call(root.querySelectorAll("select"), function (s) {
      s.onchange = function () { var a = st.ans[q.id] || {}; a[Number(s.dataset.k)] = s.value === "" ? null : Number(s.value); st.ans[q.id] = a; refreshNav(); };
    });
    Array.prototype.forEach.call(root.querySelectorAll(".qnav button"), function (b) { b.onclick = function () { st.cur = Number(b.dataset.i); run(); }; });
    document.getElementById("prev").onclick = function () { st.cur--; run(); };
    document.getElementById("next").onclick = function () { st.cur++; run(); };
    document.getElementById("fin").onclick = function () {
      var left = T.questions.length - T.questions.filter(function (qq) { return answered(qq, st.ans[qq.id]); }).length;
      if (left > 0 && !confirm("Без відповіді залишилося завдань: " + left + ". Завершити тест?")) return;
      finish(false);
    };
  }
  function refreshNav() {
    var done = 0;
    Array.prototype.forEach.call(root.querySelectorAll(".qnav button"), function (b, i) {
      var ok = answered(T.questions[i], st.ans[T.questions[i].id]); if (ok) done++;
      b.classList.toggle("ans", ok);
    });
    var top = root.querySelector(".top b"); if (top) top.textContent = done;
  }
  function finish(timeUp) {
    clearInterval(timerId);
    var score = 0, max = 0;
    T.questions.forEach(function (q) { score += scoreOf(q, st.ans[q.id]); max += maxOf(q); });
    var dur = Math.min(T.minutes * 60, (Date.now() - st.start) / 1000);
    var pct = Math.round(score / max * 100);
    var log = getLog(); log.push({ ts: Date.now(), name: st.name, score: score, max: max, percent: pct, dur: Math.round(dur) }); setLog(log);
    var rev = T.questions.map(function (q, i) {
      var a = st.ans[q.id], s = scoreOf(q, a), m = maxOf(q);
      var yours, right;
      if (q.type === "match") {
        yours = q.items.map(function (it, k) { return fmt(it.t) + " → " + (a && a[k] !== undefined && a[k] !== null ? fmt(q.options[a[k]]) : "немає відповіді"); }).join("<br>");
        right = q.items.map(function (it) { return fmt(it.t) + " → " + fmt(q.options[it.a]); }).join("<br>");
      } else {
        yours = a === undefined ? "немає відповіді" : fmt(q.options[a]);
        right = fmt(q.options[q.answer]);
      }
      return "<div class='rev " + (s === m ? "ok" : "bad") + "'><b>" + (i + 1) + ". " + fmt(q.q) + "</b> <span class='muted'>(" + s + " / " + m + ")</span>" +
        "<p>Ваша відповідь:<br>" + yours + "</p><p>Правильна відповідь:<br><b>" + right + "</b></p><p class='muted'>" + fmt(q.explain) + "</p></div>";
    }).join("");
    root.innerHTML = "<div class='card'><h1>Результат</h1>" + (timeUp ? "<p><b>Час вичерпано.</b></p>" : "") +
      "<p class='big'>" + score + " / " + max + " балів · " + pct + "%</p><p>Час: " + mmss(dur) + "</p>" +
      "<div class='row'><button class='btn' id='again'>Пройти ще раз</button><button class='btn sec' id='log'>Журнал результатів</button></div></div>" +
      "<div class='card'><h2>Правильні відповіді й пояснення</h2>" + rev + "</div>";
    document.getElementById("again").onclick = function () { st.phase = "intro"; intro(); var g = document.getElementById("go"); if (g) g.click(); };
    document.getElementById("log").onclick = function () { intro(); };
    window.scrollTo(0, 0);
  }
  intro();
})();</script></body></html>
