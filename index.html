<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Інтерактивний курс «Фонетика. Графіка. Орфоепія» для підготовки до НМТ з української мови">
<title>Фонетика. Графіка. Орфоепія | Підготовка до НМТ</title>
<style>
:root{
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eef3f8; --text:#1b2433; --muted:#5b6678;
  --primary:#123a6b; --primary-2:#1d5394; --accent:#14a3a0; --accent-soft:#e1f5f4;
  --ok:#1f8a4c; --ok-soft:#e6f5ec; --bad:#c0392b; --bad-soft:#fbeaea; --warn:#b7791f; --warn-soft:#fff6e0;
  --border:#d9e1ea; --radius:12px; --shadow:0 1px 3px rgba(18,58,107,.08),0 4px 14px rgba(18,58,107,.05);
  --font: "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
}
[data-theme="dark"]{
  --bg:#0f1622; --surface:#172131; --surface-2:#1e2a3d; --text:#e6ecf4; --muted:#9aa8bb;
  --primary:#7fb0ee; --primary-2:#9cc3f5; --accent:#38c7c3; --accent-soft:#163a3d;
  --ok:#4cc27e; --ok-soft:#163525; --bad:#ef7a6c; --bad-soft:#3a1d1c; --warn:#e7b65a; --warn-soft:#3a2f17;
  --border:#2b3a50; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
section[id],[id^="ex-"]{scroll-margin-top:84px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.6}
a{color:var(--primary-2)}
h1,h2,h3,h4{line-height:1.25;color:var(--primary);margin:0 0 .6em}
[data-theme="dark"] h1,[data-theme="dark"] h2,[data-theme="dark"] h3,[data-theme="dark"] h4{color:var(--primary-2)}
h1{font-size:1.75rem} h2{font-size:1.4rem} h3{font-size:1.15rem} h4{font-size:1rem}
p{margin:.4em 0 .8em}
sup{font-size:.7em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--primary);color:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}

/* header */
.topbar{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;box-shadow:var(--shadow)}
[data-theme="dark"] .topbar{background:#0b1a2e;border-bottom:1px solid var(--border)}
.topbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;color:#fff;text-decoration:none;font-size:1.02rem;margin-right:auto}
.brand small{display:block;font-weight:400;opacity:.8;font-size:.78rem}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a,.nav button{color:#fff;text-decoration:none;background:transparent;border:1px solid transparent;padding:6px 10px;border-radius:8px;font:inherit;font-size:.92rem;cursor:pointer}
.nav a:hover,.nav button:hover,.nav a.active{background:rgba(255,255,255,.14)}
.who{font-size:.9rem;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:999px}

.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.pill{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
[data-theme="dark"] .pill{color:#8fe3e0}
.pill.off{background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.95rem;font-weight:600;padding:9px 16px;border-radius:9px;border:1px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;text-decoration:none;min-height:42px}
[data-theme="dark"] .btn{background:var(--primary-2);border-color:var(--primary-2);color:#0f1622}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;color:var(--primary)}
[data-theme="dark"] .btn.sec{color:var(--primary-2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* progress */
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary-2),var(--accent));border-radius:999px}
.stat{font-size:2rem;font-weight:700;color:var(--primary)}
[data-theme="dark"] .stat{color:var(--primary-2)}

/* lesson list */
.lesson-item{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.lesson-num{flex:0 0 42px;height:42px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.lesson-item.locked .lesson-num{background:var(--surface-2);color:var(--muted)}
.lesson-item h3{margin:0 0 4px;font-size:1.02rem}

/* lesson layout */
.lesson-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.lesson-layout>*{min-width:0}
.toc button span{min-width:0;overflow-wrap:anywhere}
.toc{position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.toc h3{font-size:.95rem;margin-bottom:8px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li{margin:2px 0}
.toc button{width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:7px;font:inherit;font-size:.9rem;color:var(--text);cursor:pointer;display:flex;gap:6px;align-items:baseline}
.toc button:hover{background:var(--surface-2)}
.toc .t{font-size:.74rem;color:var(--accent);font-weight:700;white-space:nowrap}
.toc .sub button{padding-left:22px;font-size:.85rem}
.toc .done::after{content:"✓";color:var(--ok);margin-left:auto;font-weight:700}
.section-h{display:flex;align-items:center;gap:10px;margin:8px 0 12px}
.section-h .letter{flex:0 0 34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.time-tag{font-size:.8rem;color:var(--accent);font-weight:700;margin-left:auto;white-space:nowrap}

/* rule block */
.rule{border-left:5px solid var(--primary-2)}
.rule-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rule-head .pill{margin-left:auto}
.formula{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:600}
.box{background:var(--surface-2);border-radius:10px;padding:12px 16px;margin:12px 0}
.box.warn{background:var(--warn-soft);border-left:4px solid var(--warn)}
.box.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.box h4{margin-bottom:6px}
.box ul,.box ol{margin:4px 0;padding-left:22px}
.steps{counter-reset:s;list-style:none;padding:0;margin:6px 0}
.steps li{counter-increment:s;position:relative;padding-left:34px;margin:6px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--primary-2);color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.table-wrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.95rem;background:var(--surface)}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--surface-2);color:var(--primary);font-weight:700}
[data-theme="dark"] th{color:var(--primary-2)}
.alphabet{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.al-cell{border:1px solid var(--border);border-radius:8px;padding:6px;text-align:center;background:var(--surface);position:relative}
.al-cell b{display:block;font-size:1.25rem;color:var(--primary)}
[data-theme="dark"] .al-cell b{color:var(--primary-2)}
.al-cell span{font-size:.82rem;color:var(--muted)}
.al-n{position:absolute;top:2px;left:5px;font-size:.65rem!important}
.note{font-size:.92rem;color:var(--muted)}
details.sub{border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin:10px 0;background:var(--surface)}
details.sub summary{cursor:pointer;font-weight:700;color:var(--primary)}
[data-theme="dark"] details.sub summary{color:var(--primary-2)}

/* exercises */
.ex{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0;background:var(--surface)}
.ex-head{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.ex-type{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.ex-q{font-weight:600;margin:4px 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--surface)}
.opt:hover{background:var(--surface-2)}
.opt input{margin-top:5px;width:18px;height:18px;flex:0 0 auto}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--border)}
.row:last-child{border-bottom:0}
.row .lbl{flex:1 1 260px}
select,input[type=text],input[type=number]{font:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);min-height:40px;max-width:100%}
input[type=text].w-s{width:110px}
.row.is-ok select,.row.is-ok input{border-color:var(--ok);background:var(--ok-soft)}
.row.is-bad select,.row.is-bad input{border-color:var(--bad);background:var(--bad-soft)}
.tf{display:flex;gap:6px}
.tf label{display:flex;gap:4px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer}
.fb{margin-top:10px;padding:10px 12px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb.part{background:var(--warn-soft);border-left:4px solid var(--warn)}
.corr{font-size:.85rem;color:var(--ok);font-weight:600}

/* test */
.test-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;background:var(--surface-2);padding:4px 12px;border-radius:8px}
.timer.low{color:var(--bad)}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.qnav button{width:40px;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.qnav button.ans{background:var(--accent-soft);border-color:var(--accent)}
.qnav button.cur{outline:3px solid var(--primary-2)}
.qnav button.r-ok{background:var(--ok-soft);border-color:var(--ok)}
.qnav button.r-bad{background:var(--bad-soft);border-color:var(--bad)}
.score-big{font-size:2.4rem;font-weight:800;color:var(--primary)}
[data-theme="dark"] .score-big{color:var(--primary-2)}
.review-item{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:10px 0}
.review-item.ok{border-left:5px solid var(--ok)}
.review-item.bad{border-left:5px solid var(--bad)}

/* profiles */
.profile-card{text-align:center}
.avatar{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--primary-2),var(--accent))}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--surface);color:var(--text);border-radius:var(--radius);padding:22px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}

.footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px}

@media (max-width:900px){
  .lesson-layout{grid-template-columns:1fr}
  .toc{position:static;max-height:none}
  .lesson-layout{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .topbar{position:static}
  section[id],[id^="ex-"]{scroll-margin-top:10px}
  body{font-size:16px}
  .card{padding:14px}
  h1{font-size:1.4rem}
  .nav a,.nav button{padding:6px 7px;font-size:.85rem}
  .brand small{display:none}
}
@media print{
  .topbar,.toc,.btn,.btn-row{display:none!important}
  .lesson-layout{grid-template-columns:1fr}
}

.info-card h2{margin-bottom:.3em}
.info-card .ic-q{font-weight:600;color:var(--accent)}
.fact{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--radius);padding:12px 16px;margin:14px 0;font-size:.95rem}
.fact h4{margin-bottom:6px}
.fact h4::before{content:"\2726  ";color:var(--accent)}
.fact p{margin:.3em 0 .5em}
.keycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.keycard{border:2px solid var(--primary-2);border-radius:var(--radius);padding:14px;text-align:center;background:var(--surface)}
.keycard.alt{border-color:var(--accent)}
.kc-num{font-size:2.6rem;font-weight:800;line-height:1;color:var(--primary-2)}
.keycard.alt .kc-num{color:var(--accent)}
.kc-t{font-weight:700;margin:4px 0 8px}
.kc-list{font-size:1.3rem;letter-spacing:.06em}
.kc-note{font-size:.85rem;color:var(--muted);margin-top:6px}
.memo{border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin:12px 0}
.memo ul{margin:4px 0;padding-left:22px}

</style>

        options: ["А Звук [д͡ж] має м’яку пару.", "Б [г] і [ґ] — глухі.", "В Звук [д͡з] має м’яку пару [д͡з'].", "Г У слові «лікар» звук [р] м’який."], answer: 2,
        explain: "[д͡з] — [д͡з']. [д͡ж] м’якої пари не має, [г] і [ґ] дзвінкі, у слові лікар [р] твердий." }
    ]
  },

  summary: [
    "Приголосних звуків 32, букв для них 22: д, т, з, с, ц, л, н, р позначають і тверді, і м’які звуки; дж, дз — окремі звуки; щ = [ш] + [ч].",
    "М’яких 10 ([д'], [т'], [з'], [с'], [д͡з'], [ц'], [л'], [н'], [р'], [й]), твердих 22. Пар за твердістю — м’якістю 9; [й] пари не має.",
    "Губні, шиплячі, [г], [ґ], [к], [х] перед [і] пом’якшені. Пом’якшені — не окремі звуки й до м’яких не входять.",
    "Глухих 12, дзвінких 20. Пар за дзвінкістю — глухістю 11, зокрема [д͡ж]–[ч], [д͡з]–[ц], [д͡з']–[ц']; [ф] без пари.",
    "Сонорних 9: [в], [м], [н], [н'], [л], [л'], [р], [р'], [й]. Усі сонорні дзвінкі й не мають глухих пар.",
    "[г] — гортанний (пара [х]), [ґ] — задньоязиковий проривний (пара [к]); вони розрізняють слова: грати — ґрати.",
    "Характеристика приголосного: сонорний / шумний, дзвінкий / глухий, твердий / м’який (пом’якшений)."
  ]
};

</script>
<script>
/* Рушій сайту: профілі, маршрутизація, вправи, тести, домашні завдання, аналітика. */
(function () {
  "use strict";

  var COURSE = window.COURSE, LESSONS = window.LESSONS;
  var KEY = "fgo-nmt-v1";
  var memStore = null;
  var timers = [];
  var app = document.getElementById("app");
  var uid = 0;

  /* ---------- сховище ---------- */
  function lsGet() { try { return localStorage.getItem(KEY); } catch (e) { return memStore; } }
  function lsSet(v) { try { localStorage.setItem(KEY, v); } catch (e) { memStore = v; } }
  function newProfile(name) { return { name: name, exercises: {}, tests: {}, homework: {}, errors: [], rules: {}, last: null }; }
  function defStore() { return { v: 1, active: "p1", theme: null, profiles: { p1: newProfile("Учениця") } }; }
  function loadStore() {
    var s = null;
    try { s = JSON.parse(lsGet()); } catch (e) { s = null; }
    if (!s || !s.profiles || !s.profiles.p1) s = defStore();
    delete s.profiles.p2;
    s.active = "p1";
    var p = s.profiles.p1, d = newProfile(p.name || "Учениця");
    Object.keys(d).forEach(function (f) { if (p[f] === undefined) p[f] = d[f]; });
    return s;
  }
  var store = loadStore();
  function save() { lsSet(JSON.stringify(store)); }
  function P() { return store.active ? store.profiles[store.active] : null; }

  /* ---------- утиліти ---------- */
  function fmt(s) { return String(s == null ? "" : s).replace(/`/g, "́"); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
  function h(html) { var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
  function qs(sel, root) { return (root || document).querySelector(sel); }
  function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function mmss(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s; }
  function dt(ts) { return new Date(ts).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  var LAT = { a: "а", e: "е", i: "і", o: "о", c: "с", p: "р", x: "х", y: "у", k: "к", m: "м", t: "т", h: "н", b: "в" };
  function norm(s) {
    s = String(s == null ? "" : s).toLowerCase();
    s = s.replace(/́/g, "").replace(/[’ʼ'`‘ʹ]/g, "'").replace(/[\[\]]/g, "");
    s = s.replace(/[aeiocpxykmthb]/g, function (c) { return LAT[c]; });
    s = s.replace(/[.,;!]+$/g, "").replace(/\s+/g, " ").trim();
    return s;
  }
  var LETTERS = ["А", "Б", "В", "Г", "Д"];
  function shuffleQ(q) {
    if (q.type !== "single") return q;
    var perm = q.options.map(function (_, i) { return i; });
    for (var i = perm.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
    var lettered = q.options.every(function (o) { return /^[А-Д] /.test(o); });
    var c = {}; Object.keys(q).forEach(function (k) { c[k] = q[k]; });
    c.options = perm.map(function (pi, k) { var o = q.options[pi]; return lettered ? LETTERS[k] + " " + o.slice(2) : o; });
    c.answer = perm.indexOf(q.answer);
    return c;
  }
  function stopTimers() { timers.forEach(clearInterval); timers = []; }
  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function askConfirm(msg, okLabel) {
    return new Promise(function (resolve) {
      var prev = document.activeElement;
      var m = h("<div class='modal-bg' role='dialog' aria-modal='true' aria-labelledby='mdl-t'><div class='modal'><h3 id='mdl-t'>Підтвердження</h3><p>" + msg + "</p><div class='btn-row'><button class='btn danger' data-ok>" + (okLabel || "Так") + "</button><button class='btn sec' data-no>Скасувати</button></div></div></div>");
      function close(v) { m.remove(); document.removeEventListener("keydown", key); if (prev && prev.focus) prev.focus(); resolve(v); }
      function key(e) { if (e.key === "Escape") close(false); }
      qs("[data-ok]", m).onclick = function () { close(true); };
      qs("[data-no]", m).onclick = function () { close(false); };
      m.addEventListener("click", function (e) { if (e.target === m) close(false); });
      document.addEventListener("keydown", key);
      document.body.appendChild(m); qs("[data-no]", m).focus();
    });
  }
  function toast(msg) {
    var t = h("<div role='status' style='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 16px;border-radius:10px;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.2)'>" + msg + "</div>");
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
  }

  /* ---------- індекси правил і завдань ---------- */
  var RULES = {}, ITEMS = {};
  Object.keys(LESSONS).forEach(function (n) {
    var L = LESSONS[n];
    L.rules.forEach(function (r, i) {
      RULES[r.id] = { lesson: Number(n), idx: i + 1, title: r.title, intro: !!L.intro };
      r.exercises.forEach(function (e) { ITEMS[e.id] = { item: e, kind: "ex", lesson: Number(n) }; });
    });
    (L.warmup || []).concat(L.practicum || [], (L.homework && L.homework.practice) || []).forEach(function (e) { ITEMS[e.id] = { item: e, kind: "ex", lesson: Number(n) }; });
    testsOf(L).forEach(function (t) { t.questions.forEach(function (q) { ITEMS[q.id] = { item: q, kind: "q", lesson: Number(n), test: t.id }; }); });
  });
  /* Перехід зі структури v1 (урок 1 із сімома правилами) на v2: результати тестів і статистика зберігаються. */
  function migrate() {
    if ((store.v || 1) >= 2) return;
    var map = { r1_1: "r0_1", r1_6: "r1_5" };
    ["p1"].forEach(function (k) {
      var p = store.profiles[k];
      Object.keys(map).forEach(function (o) {
        if (!p.rules[o]) return;
        var t = p.rules[map[o]] = p.rules[map[o]] || { right: 0, wrong: 0 };
        t.right += p.rules[o].right; t.wrong += p.rules[o].wrong; delete p.rules[o];
      });
      p.errors.forEach(function (e) { if (map[e.rule]) e.rule = map[e.rule]; if (!ITEMS[e.id]) e.resolved = true; });
      if (p.homework.l1) { p.homework.l1.theory = {}; p.homework.l1.selfcheck = {}; }
    });
    store.v = 2; save();
  }
  migrate();
  /* Помилки в завданнях, яких більше немає в курсі, знімаємо з активних. */
  ["p1"].forEach(function (k) { store.profiles[k].errors.forEach(function (e) { if (!ITEMS[e.id]) e.resolved = true; }); });
  save();
  function lessonExercises(L) {
    var a = (L.warmup || []).slice();
    L.rules.forEach(function (r) { a = a.concat(r.exercises); });
    return a.concat(L.practicum || []);
  }
  function testsOf(L) { return [L.finalTest, L.homework && L.homework.test, L.extraTest].filter(Boolean); }
  var MAIN = COURSE.lessons.filter(function (l) { return !l.intro; });
  function testKindName(L, id) { return L.intro ? "Міні-тест" : id === L.finalTest.id ? "Підсумковий тест" : (L.extraTest && id === L.extraTest.id) ? "Додатковий тест" : "Тест ДЗ"; }

  /* ---------- облік результатів ---------- */
  function ruleStat(p, rule) { if (!p.rules[rule]) p.rules[rule] = { right: 0, wrong: 0 }; return p.rules[rule]; }
  function recordItem(id, rule, lesson, ok, total, source) {
    var p = P(); if (!p) return;
    var st = ruleStat(p, rule); st.right += ok; st.wrong += (total - ok);
    if (ok < total) p.errors.push({ ts: Date.now(), id: id, rule: rule, lesson: lesson, source: source, lost: total - ok, resolved: false });
    else p.errors.forEach(function (e) { if (e.id === id) e.resolved = true; });
  }
  function recordExercise(ex, ok, total, source) {
    var p = P(); if (!p) return;
    var r = p.exercises[ex.id] || { attempts: 0, best: 0, everOk: false, last: 0 };
    r.attempts++; r.last = pct(ok, total); r.best = Math.max(r.best, r.last); if (ok === total) r.everOk = true; r.ts = Date.now();
    p.exercises[ex.id] = r;
    recordItem(ex.id, ex.rule, RULES[ex.rule] ? RULES[ex.rule].lesson : 1, ok, total, source);
    save();
  }
  function bestOf(p, testId) { var a = p.tests[testId] || []; return a.length ? Math.max.apply(null, a.map(function (x) { return x.percent; })) : null; }
  function lessonProgress(p, L) {
    var ex = lessonExercises(L), done = ex.filter(function (e) { return p.exercises[e.id] && p.exercises[e.id].everOk; }).length;
    var total = ex.length + 1 + (L.extraTest ? 1 : 0) + (L.homework ? 1 : 0), val = done;
    if ((p.tests[L.finalTest.id] || []).length) val++;
    if (L.extraTest && (p.tests[L.extraTest.id] || []).length) val++;
    if (p.homework[L.id] && p.homework[L.id].done) val++;
    return pct(val, total);
  }
  function lessonCompleted(p, L) { return (p.tests[L.finalTest.id] || []).length > 0; }

  /* ---------- вправи ---------- */
  var TYPE_NAMES = { single: "одна правильна відповідь", multi: "кілька правильних відповідей", tf: "правильне чи неправильне твердження", fill: "заповнення пропусків", match: "установлення відповідності", sort: "розподіл за категоріями" };

  function ruleLink(rule) {
    var R = RULES[rule]; if (!R) return "";
    return "<a href='#/lesson/" + R.lesson + "/rule/" + rule + "'>" + (R.intro ? "Урок 0. " : "Правило " + R.idx + ". ") + fmt(R.title) + "</a>";
  }

  function renderExercise(ex0, source, numberLabel) {
    var ex = shuffleQ(ex0);
    var n = ++uid, name = "x" + n;
    var p = P(), rec = p && p.exercises[ex.id];
    var box = h("<div class='ex' id='ex-" + ex.id + "-" + n + "'></div>");
    var body = "";
    if (ex.type === "single" || ex.type === "multi") {
      body = ex.options.map(function (o, j) {
        return "<label class='opt'><input type='" + (ex.type === "single" ? "radio" : "checkbox") + "' name='" + name + "' value='" + j + "'><span>" + fmt(o) + "</span></label>";
      }).join("");
    } else if (ex.type === "tf") {
      body = ex.statements.map(function (s, j) {
        return "<div class='row' data-row='" + j + "'><span class='lbl'>" + fmt(s.t) + "</span><span class='tf' role='radiogroup' aria-label='Оцінка твердження " + (j + 1) + "'>" +
          "<label><input type='radio' name='" + name + "-" + j + "' value='1'> Так</label><label><input type='radio' name='" + name + "-" + j + "' value='0'> Ні</label></span><span class='corr'></span></div>";
      }).join("");
    } else if (ex.type === "fill") {
      body = ex.items.map(function (it, j) {
        return "<div class='row' data-row='" + j + "'><label class='lbl' for='" + name + "-" + j + "'>" + fmt(it.label) + "</label><input type='text' class='w-s' id='" + name + "-" + j + "' autocomplete='off' spellcheck='false'><span class='corr'></span></div>";
      }).join("");
    } else if (ex.type === "match" || ex.type === "sort") {
      var opts = ex.type === "match" ? ex.options : ex.categories;
      body = ex.items.map(function (it, j) {
        return "<div class='row' data-row='" + j + "'><label class='lbl' for='" + name + "-" + j + "'>" + fmt(it.t) + "</label><select id='" + name + "-" + j + "'><option value=''>— оберіть —</option>" +
          opts.map(function (o, k) { return "<option value='" + k + "'>" + fmt(o) + "</option>"; }).join("") + "</select><span class='corr'></span></div>";
      }).join("");
    }
    box.innerHTML = "<div class='ex-head'>" + (numberLabel ? "<b>" + numberLabel + "</b>" : "") + "<span class='ex-type'>" + TYPE_NAMES[ex.type] + "</span>" + (ex.tag ? "<span class='pill" + (ex.tag === "формат НМТ" ? "" : " off") + "'>" + esc(ex.tag) + "</span>" : "") +
      (rec ? "<span class='pill " + (rec.everOk ? "ok" : "bad") + "'>спроб: " + rec.attempts + (rec.everOk ? " · виконано" : "") + "</span>" : "") + "</div>" +
      "<div class='ex-q'>" + fmt(ex.q) + "</div><div class='ex-body'>" + body + "</div>" +
      "<div class='btn-row'><button class='btn' data-check>Перевірити</button><button class='btn sec' data-retry hidden>Спробувати ще</button></div>" +
      "<div class='fb' aria-live='polite'></div>";

    function collect() {
      if (ex.type === "single") { var r = qs("input:checked", box); return r ? Number(r.value) : null; }
      if (ex.type === "multi") { var c = qsa("input:checked", box).map(function (x) { return Number(x.value); }); return c.length ? c : null; }
      if (ex.type === "tf") { var a = ex.statements.map(function (_, j) { var r = qs("input[name='" + name + "-" + j + "']:checked", box); return r ? r.value === "1" : null; }); return a.some(function (v) { return v !== null; }) ? a : null; }
      if (ex.type === "fill") { var f = ex.items.map(function (_, j) { return qs("#" + name + "-" + j, box).value; }); return f.some(function (v) { return v.trim() !== ""; }) ? f : null; }
      var s = ex.items.map(function (_, j) { var v = qs("#" + name + "-" + j, box).value; return v === "" ? null : Number(v); });
      return s.some(function (v) { return v !== null; }) ? s : null;
    }
    function check() {
      var a = collect(), fb = qs(".fb", box);
      if (a === null) { fb.className = "fb show part"; fb.innerHTML = "Спершу дайте відповідь, а потім натисніть «Перевірити»."; return; }
      var ok = 0, total = 0;
      if (ex.type === "single") {
        total = 1; ok = a === ex.answer ? 1 : 0;
        qsa(".opt", box).forEach(function (l, j) { if (j === a) l.classList.add(ok ? "is-ok" : "is-bad"); if (!ok && j === ex.answer) l.classList.add("is-ok"); });
      } else if (ex.type === "multi") {
        total = ex.options.length;
        qsa(".opt", box).forEach(function (l, j) {
          var should = ex.answer.indexOf(j) >= 0, chosen = a.indexOf(j) >= 0;
          if (should === chosen) ok++;
          if (chosen) l.classList.add(should ? "is-ok" : "is-bad"); else if (should) l.classList.add("is-ok");
        });
      } else {
        var list = ex.type === "tf" ? ex.statements : ex.items;
        total = list.length;
        list.forEach(function (it, j) {
          var row = qs("[data-row='" + j + "']", box), good, rightText;
          if (ex.type === "tf") { good = a[j] === it.a; rightText = it.a ? "Так" : "Ні"; }
          else if (ex.type === "fill") { good = it.answers.some(function (v) { return norm(v) === norm(a[j]); }) || it.answers.some(function (v) { return norm(v).replace(/[\s,]/g, "") === norm(a[j]).replace(/[\s,]/g, ""); }); rightText = it.answers[0]; }
          else if (ex.type === "match") { good = a[j] === it.a; rightText = ex.options[it.a]; }
          else { good = a[j] === it.c; rightText = ex.categories[it.c]; }
          if (good) ok++;
          row.classList.add(good ? "is-ok" : "is-bad");
          qs(".corr", row).innerHTML = good ? "✓" : "правильно: " + fmt(rightText);
        });
      }
      qsa("input,select", qs(".ex-body", box)).forEach(function (x) { x.disabled = true; });
      var full = ok === total;
      fb.className = "fb show " + (full ? "ok" : ok > 0 ? "part" : "bad");
      fb.innerHTML = "<b>" + (full ? "Правильно!" : ok > 0 ? "Частково правильно: " + ok + " з " + total + "." : "Неправильно.") + "</b> " + fmt(ex.explain) +
        (full ? "" : "<br><span class='small'>Повторіть: " + ruleLink(ex.rule) + "</span>");
      qs("[data-check]", box).hidden = true; qs("[data-retry]", box).hidden = false;
      recordExercise(ex, ok, total, source);
    }
    qs("[data-check]", box).onclick = check;
    qs("[data-retry]", box).onclick = function () { var nb = renderExercise(ex0, source, numberLabel); box.replaceWith(nb); var f = qs("input,select", nb); if (f) f.focus(); };
    return box;
  }

  /* ---------- тести ---------- */
  function qMax(q) { return q.type === "match" ? q.items.length : 1; }
  function qScore(q, a) {
    if (q.type === "match") { var c = 0; q.items.forEach(function (it, i) { if (a && a[i] === it.a) c++; }); return c; }
    return a === q.answer ? 1 : 0;
  }
  function qAnswered(q, a) {
    if (a === undefined || a === null) return false;
    if (q.type === "match") return q.items.every(function (_, i) { return a[i] !== undefined && a[i] !== null; });
    return true;
  }

  function renderTest(container, test0, lessonN) {
    var test = test0;
    var st = { phase: "intro", cur: 0, ans: {}, start: 0 };
    var limit = test.minutes * 60;
    function attempts() { var p = P(); return (p && p.tests[test.id]) || []; }
    function intro() {
      var at = attempts();
      container.innerHTML = "<div class='card'><h2>" + esc(test.title) + "</h2>" +
        "<div class='grid g3'><div><div class='stat'>" + test.questions.length + "</div><div class='muted small'>завдань</div></div><div><div class='stat'>" + test.minutes + " хв</div><div class='muted small'>час</div></div><div><div class='stat'>" + at.length + "</div><div class='muted small'>спроб</div></div></div>" +
        "<p>Завдання з однією правильною відповіддю оцінюються 1 балом. У завданнях на встановлення відповідності кожна правильна пара — 1 бал. Між завданнями можна переходити. Правильні відповіді з’являться лише після завершення тесту.</p>" +
        "<p class='muted small'>Авторські завдання, подібні за логікою до НМТ. Це не офіційні завдання НМТ.</p>" +
        "<div class='btn-row'><button class='btn acc' data-start>Розпочати тест</button></div></div>" + historyHtml(at);
      qs("[data-start]", container).onclick = start;
    }
    function historyHtml(at) {
      if (!at.length) return "<div class='card'><h3>Журнал результатів</h3><p class='muted'>Спроб ще немає.</p></div>";
      return "<div class='card'><h3>Журнал результатів</h3><div class='table-wrap'><table><thead><tr><th>№</th><th>Дата</th><th>Бали</th><th>%</th><th>Час</th></tr></thead><tbody>" +
        at.map(function (r, i) { return "<tr><td>" + (i + 1) + "</td><td>" + dt(r.ts) + "</td><td>" + r.score + " / " + r.max + "</td><td>" + r.percent + "%</td><td>" + mmss(r.duration) + (r.timeUp ? " (час вичерпано)" : "") + "</td></tr>"; }).reverse().join("") +
        "</tbody></table></div></div>";
    }
    function start() {
      stopTimers();
      var c = {}; Object.keys(test0).forEach(function (k) { c[k] = test0[k]; });
      c.questions = test0.questions.map(shuffleQ); test = c;
      st = { phase: "run", cur: 0, ans: {}, start: Date.now() };
      timers.push(setInterval(function () {
        var left = limit - (Date.now() - st.start) / 1000;
        var t = qs("[data-timer]", container);
        if (t) { t.textContent = mmss(left); t.classList.toggle("low", left < 60); }
        if (left <= 0 && st.phase === "run") finish(true);
      }, 500));
      run();
    }
    function answeredCount() { return test.questions.filter(function (q) { return qAnswered(q, st.ans[q.id]); }).length; }
    function run() {
      var q = test.questions[st.cur];
      var left = limit - (Date.now() - st.start) / 1000;
      var body;
      if (q.type === "match") {
        var a = st.ans[q.id] || {};
        body = q.items.map(function (it, i) {
          return "<div class='row'><label class='lbl' for='tq-" + i + "'>" + fmt(it.t) + "</label><select id='tq-" + i + "' data-k='" + i + "'><option value=''>— оберіть —</option>" +
            q.options.map(function (o, j) { return "<option value='" + j + "'" + (a[i] === j ? " selected" : "") + ">" + fmt(o) + "</option>"; }).join("") + "</select></div>";
        }).join("");
      } else {
        body = q.options.map(function (o, j) {
          return "<label class='opt'><input type='radio' name='tq' value='" + j + "'" + (st.ans[q.id] === j ? " checked" : "") + "><span>" + fmt(o) + "</span></label>";
        }).join("");
      }
      container.innerHTML = "<div class='card'><div class='test-top'><span class='timer' data-timer aria-label='Залишок часу'>" + mmss(left) + "</span>" +
        "<span>Виконано: <b data-count>" + answeredCount() + "</b> з " + test.questions.length + "</span>" +
        "<button class='btn danger' data-finish style='margin-left:auto'>Завершити тест</button></div>" +
        "<nav class='qnav' aria-label='Перехід між завданнями'>" + test.questions.map(function (qq, i) {
          return "<button data-i='" + i + "' class='" + (qAnswered(qq, st.ans[qq.id]) ? "ans " : "") + (i === st.cur ? "cur" : "") + "' aria-label='Завдання " + (i + 1) + "'" + (i === st.cur ? " aria-current='true'" : "") + ">" + (i + 1) + "</button>";
        }).join("") + "</nav>" +
        "<h3>Завдання " + (st.cur + 1) + " з " + test.questions.length + (q.type === "match" ? " <span class='pill'>відповідність</span>" : "") + "</h3>" +
        "<p class='ex-q'>" + fmt(q.q) + "</p><div>" + body + "</div>" +
        "<div class='btn-row'><button class='btn sec' data-prev" + (st.cur === 0 ? " disabled" : "") + ">← Попереднє</button><button class='btn sec' data-next" + (st.cur === test.questions.length - 1 ? " disabled" : "") + ">Наступне →</button></div></div>";
      qsa("input[type=radio]", container).forEach(function (r) { r.onchange = function () { st.ans[q.id] = Number(r.value); refresh(); }; });
      qsa("select", container).forEach(function (s) { s.onchange = function () { var a = st.ans[q.id] || {}; a[Number(s.dataset.k)] = s.value === "" ? null : Number(s.value); st.ans[q.id] = a; refresh(); }; });
      qsa(".qnav button", container).forEach(function (b) { b.onclick = function () { st.cur = Number(b.dataset.i); run(); focusQ(); }; });
      qs("[data-prev]", container).onclick = function () { st.cur--; run(); focusQ(); };
      qs("[data-next]", container).onclick = function () { st.cur++; run(); focusQ(); };
      qs("[data-finish]", container).onclick = function () {
        var rest = test.questions.length - answeredCount();
        if (rest > 0) askConfirm("Без відповіді залишилося завдань: " + rest + ". Завершити тест?", "Завершити").then(function (y) { if (y) finish(false); });
        else finish(false);
      };
    }
    function focusQ() { var f = qs("input,select", container); if (f) f.focus(); }
    function refresh() {
      qsa(".qnav button", container).forEach(function (b, i) { b.classList.toggle("ans", qAnswered(test.questions[i], st.ans[test.questions[i].id])); });
      var c = qs("[data-count]", container); if (c) c.textContent = answeredCount();
    }
    function finish(timeUp) {
      if (st.phase !== "run") return;
      st.phase = "done"; stopTimers();
      var score = 0, max = 0, details = [];
      var p = P();
      test.questions.forEach(function (q) {
        var s = qScore(q, st.ans[q.id]), m = qMax(q);
        score += s; max += m; details.push({ id: q.id, s: s, m: m });
        if (p) recordItem(q.id, q.rule, lessonN, s, m, test.id);
      });
      var duration = Math.min(limit, (Date.now() - st.start) / 1000);
      var res = { ts: Date.now(), score: score, max: max, percent: pct(score, max), duration: Math.round(duration), timeUp: !!timeUp, details: details };
      if (p) { (p.tests[test.id] = p.tests[test.id] || []).push(res); save(); }
      showResult(res);
    }
    function showResult(res) {
      var rev = test.questions.map(function (q, i) {
        var a = st.ans[q.id], d = res.details[i], yours, right;
        if (q.type === "match") {
          yours = q.items.map(function (it, k) { return fmt(it.t) + " → " + (a && a[k] != null ? fmt(q.options[a[k]]) : "<i>немає відповіді</i>"); }).join("<br>");
          right = q.items.map(function (it) { return fmt(it.t) + " → " + fmt(q.options[it.a]); }).join("<br>");
        } else {
          yours = a === undefined ? "<i>немає відповіді</i>" : fmt(q.options[a]);
          right = fmt(q.options[q.answer]);
        }
        var ok = d.s === d.m;
        return "<div class='review-item " + (ok ? "ok" : "bad") + "'><b>" + (i + 1) + ". " + fmt(q.q) + "</b> <span class='pill " + (ok ? "ok" : "bad") + "'>" + d.s + " / " + d.m + "</span>" +
          "<p class='small'>Ваша відповідь:<br>" + yours + "</p><p class='small'>Правильна відповідь:<br><b>" + right + "</b></p>" +
          "<p class='small muted'>" + fmt(q.explain) + "</p>" + (ok ? "" : "<p class='small'>Повторіть: " + ruleLink(q.rule) + "</p>") + "</div>";
      }).join("");
      var verdict = res.percent >= 90 ? "Чудовий результат!" : res.percent >= 70 ? "Добрий результат. Перегляньте помилки." : res.percent >= 50 ? "Задовільно. Варто повторити правила з помилками." : "Потрібно повторити теорію уроку й пройти тест ще раз.";
      container.innerHTML = "<div class='card'><h2>Результат: " + esc(test.title) + "</h2>" + (res.timeUp ? "<p class='box warn'>Час вичерпано, тест завершено автоматично.</p>" : "") +
        "<div class='grid g3'><div><div class='score-big'>" + res.score + " / " + res.max + "</div><div class='muted small'>балів</div></div><div><div class='score-big'>" + res.percent + "%</div><div class='muted small'>успішність</div></div><div><div class='score-big'>" + mmss(res.duration) + "</div><div class='muted small'>витрачено часу</div></div></div>" +
        "<p><b>" + verdict + "</b></p><div class='bar' aria-hidden='true'><span style='width:" + res.percent + "%'></span></div>" +
        "<div class='btn-row'><button class='btn acc' data-again>Пройти ще раз</button><a class='btn sec' href='#/errors'>Робота над помилками</a><a class='btn sec' href='#/lesson/" + lessonN + "'>До уроку</a></div></div>" +
        "<div class='card'><h3>Правильні відповіді й пояснення</h3>" + rev + "</div>" + historyHtml(attempts());
      qs("[data-again]", container).onclick = start;
      window.scrollTo(0, container.getBoundingClientRect().top + window.scrollY - 80);
    }
    intro();
  }

    var main = "<div>" +
      "<div class='card'><span class='pill'>Урок " + n + " з " + MAIN.length + " · 60 хвилин</span><h1 style='margin-top:8px'>" + esc(L.title) + "</h1>" +
      "<div class='btn-row'><a class='btn acc' href='#/lesson/" + n + "/test'>Підсумковий тест</a><a class='btn sec' href='#/lesson/" + n + "/homework'>Домашнє завдання</a><a class='btn sec' href='#/lesson/" + n + "/extra'>Додатковий тест</a></div></div>" +
      "<section class='card' id='sec-goal'>" + sectionHead("", "Мета та очікувані результати") + "<p><b>Мета:</b> " + esc(L.goal) + "</p><p><b>Після уроку учениця:</b></p>" + listHtml(L.outcomes) + "</section>" +
      "<section class='card' id='sec-plan'>" + sectionHead("", "План заняття") + "<div class='table-wrap'><table><thead><tr><th>Час</th><th>Етап</th></tr></thead><tbody>" +
      L.plan.map(function (s) { return "<tr><td><b>" + s.time + "</b></td><td><a href='#' data-go='" + s.anchor + "'>" + esc(s.title) + "</a></td></tr>"; }).join("") +
      "</tbody></table></div><p class='small muted'>Методична послідовність: пояснення → приклад → розбір → вправа → перевірка → пояснення помилки → наступне правило.</p></section>" +
      "<section class='card' id='warmup'>" + sectionHead("", "Актуалізація знань", "0–5 хв") + "<p>Швидка перевірка перед новою темою.</p><div data-ex='warmup'></div></section>" +
      "<section class='card' id='rules'>" + sectionHead("", "Теоретичні підтеми", "5–30 хв") + "<p>Урок складається з " + L.rules.length + " правил. Після кожного правила виконайте вправи й лише потім переходьте до наступного.</p>" +
      "<ol>" + L.rules.map(function (r) { return "<li><a href='#' data-go='" + r.id + "'>" + fmt(r.title) + "</a></li>"; }).join("") + "</ol>" +
      "<p class='small muted'>Позначення у транскрипції: [ ] — звуки; ' — м’якість; : — подовження; ´ — наголос; маленька буква вгорі (е<sup>и</sup>) — наближення до іншого звука.</p></section>" +
      L.rules.map(function (r, i) { return ruleHtml(r, i + 1); }).join("") +
      "<section class='card' id='practicum'>" + sectionHead("", esc(L.practicumTitle || "Практикум у форматі НМТ"), "30–45 хв") + "<p>" + (L.practicumNote ? fmt(L.practicumNote) : L.practicum.length + " завдань, подібних за логікою до НМТ: з однією правильною відповіддю та на встановлення відповідності. Кожне завдання перевіряйте одразу.") + "</p><div data-ex='practicum'></div></section>" +
      "<section class='card' id='final'>" + sectionHead("", "Підсумкове тестування", "45–55 хв") + finalCard(p, L) + "</section>" +
      "<section class='card' id='summary'>" + sectionHead("", "Підсумок уроку", "55–60 хв") + "<div class='box'><h4>Головне з уроку</h4>" + listHtml(L.summary) + "</div></section>" +
      "<section class='card' id='homework'>" + sectionHead("", "Домашнє завдання") + hwCard(p, L) + "</section>" +
      "<section class='card' id='extra'>" + sectionHead("", "Додатковий HTML-тест") + extraCard(p, L) + "</section>" +
      "<section class='card' id='lesson-res'>" + sectionHead("", "Результати уроку") + lessonResultsHtml(p, L) + "</section>" +
      "</div>";
    app.innerHTML = "<div class='lesson-layout'>" + toc + main + "</div>";

    var w = qs("[data-ex='warmup']", app);
    L.warmup.forEach(function (e, i) { w.appendChild(renderExercise(e, "warmup", "Питання " + (i + 1))); });
    L.rules.forEach(function (r) {
      var c = qs("[data-ex='" + r.id + "']", app);
      var cs = qs("[data-ex-self='" + r.id + "']", app);
      r.exercises.forEach(function (e, i) { (e.self && cs ? cs : c).appendChild(renderExercise(e, "rule", "Вправа " + (i + 1))); });
    });
    var pr = qs("[data-ex='practicum']", app);
    L.practicum.forEach(function (e, i) { pr.appendChild(renderExercise(e, "practicum", "Завдання " + (i + 1))); });
    qsa("[data-go]", app).forEach(function (b) {
      b.addEventListener("click", function (e) { e.preventDefault(); var t = document.getElementById(b.dataset.go); if (t) { t.scrollIntoView({ behavior: "smooth", block: "start" }); t.setAttribute("tabindex", "-1"); t.focus({ preventScroll: true }); } });
    });
    if (focusRule) { var t = document.getElementById(focusRule); if (t) setTimeout(function () { t.scrollIntoView({ block: "start" }); }, 30); }
    else window.scrollTo(0, 0);
  }

  function ruleHtml(r, i) {
    var box = function (cls, title, inner) { return "<div class='box" + (cls ? " " + cls : "") + "'><h4>" + title + "</h4>" + inner + "</div>"; };
    return "<section class='card rule' id='" + r.id + "'><div class='rule-head'><span class='pill'>Правило " + i + "</span><h2 style='margin:0;flex:1 1 300px'>" + fmt(r.title) + "</h2>" + (r.time ? "<span class='time-tag'>" + r.time + " на занятті</span>" : "") + "</div>" +
      "<h3 style='margin-top:14px'>Пояснення</h3>" + r.explain.map(function (x) { return "<p>" + fmt(x) + "</p>"; }).join("") +
      "<div class='formula'><span class='small'>Формулювання правила</span><br>" + fmt(r.formula) + "</div>" +
      (r.keycards ? fmt(r.keycards) : "") +
      (r.conditions && r.conditions.length ? box("", "Умови застосування", listHtml(r.conditions)) : "") +
      (r.table ? box("", r.tableTitle || "Таблиця", "<div class='table-wrap'>" + fmt(r.table) + "</div>") : "") +
      (r.fact ? "<aside class='fact'><h4>" + fmt(r.fact.title) + "</h4>" + r.fact.text.map(function (x) { return "<p>" + fmt(x) + "</p>"; }).join("") + "</aside>" : "") +
      (r.examples && r.examples.length ? box("", "Приклади", listHtml(r.examples)) : "") +
      (r.analysis || []).map(function (a) { return "<details class='sub' open><summary>" + fmt(a.title) + "</summary><ol class='steps'>" + a.steps.map(function (s) { return "<li>" + fmt(s) + "</li>"; }).join("") + "</ol></details>"; }).join("") +
      (r.exceptions && r.exceptions.length ? box("warn", "Зверніть увагу", listHtml(r.exceptions)) : "") +
      (r.mistakes && r.mistakes.length ? box("bad", "Типові помилки", listHtml(r.mistakes)) : "") +
      (r.algorithm && r.algorithm.length ? box("", r.algorithmTitle || "Алгоритм для завдання НМТ", listHtml(r.algorithm, true)) : "") +
      (r.memo && r.memo.length ? "<div class='memo'><h4>Запам’ятай!</h4>" + listHtml(r.memo) + "</div>" : "") +
      "<h3>Вправи на закріплення</h3><div data-ex='" + r.id + "'></div>" +
      (r.exercises.some(function (e) { return e.self; }) ? "<details class='sub'><summary>Додатково для самостійної роботи (" + r.exercises.filter(function (e) { return e.self; }).length + ")</summary><div data-ex-self='" + r.id + "'></div></details>" : "") + "</section>";
  }

  /* ---------- урок 0: короткий вступ ---------- */
  function viewIntro(n, focusRule) {
    var L = LESSONS[n], p = P(), rule = L.rules[0];

      "<section class='grid g2' aria-label='Чотири розділи'>" + L.cards.map(function (c) {
        return "<div class='card info-card'><h2>" + esc(c.name) + "</h2><p>" + fmt(c.what) + "</p><p class='ic-q'>" + fmt(c.question) + "</p><p class='small muted'>Приклад: " + fmt(c.example) + "</p></div>";
      }).join("") + "</section>" +

      "<section class='card'><h2>Міні-тест</h2><p>" + L.finalTest.questions.length + " завдань, " + L.finalTest.minutes + " хв. Відповіді й пояснення з’являться після завершення.</p>" +
      "<p>Спроб: <b>" + at.length + "</b>" + (b !== null ? " · найкращий результат: <b>" + b + "%</b>" : "") + "</p>" +
      "<div class='btn-row'><a class='btn acc' href='#/lesson/" + n + "/test'>Відкрити міні-тест</a><a class='btn sec' href='#/lesson/1'>Перейти до уроку 1 →</a></div></section>";
    var c = qs("[data-ex='" + rule.id + "']", app);

    else window.scrollTo(0, 0);

  function finalCard(p, L) {
    var at = p.tests[L.finalTest.id] || [], b = bestOf(p, L.finalTest.id);
    return "<p>" + L.finalTest.questions.length + " завдань, " + L.finalTest.minutes + " хв, таймер, перехід між завданнями, автоматичне оцінювання. Відповіді й пояснення з’являться після завершення.</p>" +
      "<p>Спроб: <b>" + at.length + "</b>" + (b !== null ? " · найкращий результат: <b>" + b + "%</b>" : "") + "</p>" +
      "<a class='btn acc' href='#/lesson/" + L.n + "/test'>Відкрити підсумковий тест</a>";
  }
  function hwCard(p, L) {
    var hw = p.homework[L.id] || {};
    return "<p>Частина 1 — теорія; частина 2 — " + L.homework.practice.length + " практичних завдань і письмові завдання із самоперевіркою; частина 3 — тест із " + L.homework.test.questions.length + " запитань; частина 4 — робота над помилками.</p>" +
      "<p>Стан: " + (hw.done ? "<span class='pill ok'>виконано " + (hw.doneAt ? dt(hw.doneAt) : "") + "</span>" : "<span class='pill off'>не виконано</span>") + "</p>" +
      "<a class='btn acc' href='#/lesson/" + L.n + "/homework'>Відкрити домашнє завдання</a>";
  }
  function extraCard(p, L) {
    var at = p.tests[L.extraTest.id] || [], b = bestOf(p, L.extraTest.id);
    return "<p>Окремий тест із " + L.extraTest.questions.length + " нових запитань (не повторює підсумковий тест). Таймер " + L.extraTest.minutes + " хв, пояснення до кожної відповіді, журнал результатів.</p>" +
      "<p>Спроб: <b>" + at.length + "</b>" + (b !== null ? " · найкращий результат: <b>" + b + "%</b>" : "") + "</p>" +
      "<a class='btn acc' href='#/lesson/" + L.n + "/extra'>Відкрити додатковий тест</a>";
  }
  function lessonResultsHtml(p, L) {
    var ex = lessonExercises(L), done = ex.filter(function (e) { return p.exercises[e.id] && p.exercises[e.id].everOk; }).length;
    var rows = L.rules.map(function (r, i) {
      var s = p.rules[r.id] || { right: 0, wrong: 0 }, t = s.right + s.wrong;
      return "<tr><td>" + (i + 1) + ". " + fmt(r.title) + "</td><td>" + (t ? pct(s.right, t) + "%" : "—") + "</td><td>" + s.wrong + "</td></tr>";
    }).join("");
    return "<p>Вправ виконано правильно: <b>" + done + " з " + ex.length + "</b>.</p>" +
      "<div class='table-wrap'><table><thead><tr><th>Тест</th><th>Спроб</th><th>Найкращий</th><th>Останній</th></tr></thead><tbody>" +
      testsOf(L).map(function (t) { var a = p.tests[t.id] || []; return "<tr><td>" + testKindName(L, t.id) + "</td><td>" + a.length + "</td><td>" + (a.length ? bestOf(p, t.id) + "%" : "—") + "</td><td>" + (a.length ? a[a.length - 1].percent + "%" : "—") + "</td></tr>"; }).join("") +
      "</tbody></table></div><div class='table-wrap'><table><thead><tr><th>Правило</th><th>Засвоєння</th><th>Помилок</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
      "<a class='btn sec' href='#/results'>Усі результати</a>";
  }

  function viewTest(n, kind) {
    var L = LESSONS[n]; if (!L) { viewMissing(n); return; }
    header("lesson" + n);
    var p = P(); p.last = "#/lesson/" + n + "/" + kind; save();
    var test = kind === "extra" ? L.extraTest : kind === "hwtest" ? (L.homework && L.homework.test) : L.finalTest;
    if (!test) { viewMissing(n); return; }
    app.innerHTML = "<p><a href='#/lesson/" + n + "'>← Урок " + n + ". " + esc(L.title) + "</a>" + (kind === "hwtest" ? " · <a href='#/lesson/" + n + "/homework'>Домашнє завдання</a>" : "") + "</p><div data-test></div>";
    renderTest(qs("[data-test]", app), test, Number(n));
    window.scrollTo(0, 0);
  }

  /* ---------- домашнє завдання ---------- */
  function viewHomework(n) {
    var L = LESSONS[n]; if (!L || !L.homework) { viewMissing(n); return; }
    header("lesson" + n);
    var p = P(); p.last = "#/lesson/" + n + "/homework";
    var hw = p.homework[L.id] = p.homework[L.id] || { done: false, theory: {}, written: {}, selfcheck: {} };
    hw.theory = hw.theory || {}; hw.written = hw.written || {}; hw.selfcheck = hw.selfcheck || {};
    save();
    var practiceDone = L.homework.practice.filter(function (e) { return p.exercises[e.id] && p.exercises[e.id].everOk; }).length;
    var tb = bestOf(p, L.homework.test.id);
    var html = "<p><a href='#/lesson/" + n + "'>← Урок " + n + ". " + esc(L.title) + "</a></p>" +
      "<div class='card'><h1>Домашнє завдання. Урок " + n + "</h1><p>" + esc(L.title) + "</p>" +
      "<div class='grid g3'><div><div class='stat'>" + Object.keys(hw.theory).filter(function (k) { return hw.theory[k]; }).length + " / " + L.homework.theory.length + "</div><div class='muted small'>правил вивчено</div></div>" +
      "<div><div class='stat'>" + practiceDone + " / " + L.homework.practice.length + "</div><div class='muted small'>практичних завдань виконано</div></div>" +
      "<div><div class='stat'>" + (tb === null ? "—" : tb + "%") + "</div><div class='muted small'>найкращий результат тесту ДЗ</div></div></div>" +
      "<div class='btn-row'><button class='btn " + (hw.done ? "sec" : "acc") + "' data-done>" + (hw.done ? "✓ Позначено виконаним (зняти позначку)" : "Позначити домашнє завдання виконаним") + "</button></div></div>" +
      "<section class='card'><h2>Частина 1. Теорія</h2><p>Вивчіть правила уроку. Позначте кожне правило, коли можете пояснити його без підручника.</p>" +
      L.homework.theory.map(function (t, i) { var r = L.rules[i]; return "<label class='opt'><input type='checkbox' data-th='" + i + "'" + (hw.theory[i] ? " checked" : "") + "><span>" + fmt(t) + (r ? " <a href='#/lesson/" + n + "/rule/" + r.id + "'>(відкрити правило)</a>" : "") + "</span></label>"; }).join("") + "</section>" +
      "<section class='card'><h2>Частина 2. Практика</h2><p>Виконайте " + L.homework.practice.length + " завдань із автоматичною перевіркою та письмові завдання із самоперевіркою.</p><div data-hwp></div>" +
      "<h3>Письмові завдання</h3>" + L.homework.written.map(function (w, i) {
        return "<div class='ex'><div class='ex-head'><b>Письмове завдання " + (i + 1) + "</b><span class='ex-type'>самоперевірка</span></div><p class='ex-q'>" + fmt(w.task) + "</p>" +
          "<label class='small muted' for='wr-" + i + "'>Ваша відповідь (зберігається автоматично):</label><textarea id='wr-" + i + "' data-wr='" + i + "' rows='4' style='width:100%;font:inherit;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)'>" + esc(hw.written[i] || "") + "</textarea>" +
          "<div class='btn-row'><button class='btn sec' data-show='" + i + "'>Показати зразок і критерії самоперевірки</button></div>" +
          "<div data-sample='" + i + "' hidden><div class='box'><h4>Зразок виконання</h4><p>" + fmt(w.sample) + "</p></div><div class='box'><h4>Критерії самоперевірки</h4>" +
          w.criteria.map(function (c, k) { var key = i + "-" + k; return "<label class='opt'><input type='checkbox' data-sc='" + key + "'" + (hw.selfcheck[key] ? " checked" : "") + "><span>" + fmt(c) + "</span></label>"; }).join("") + "</div></div></div>";
      }).join("") + "</section>" +
      "<section class='card'><h2>Частина 3. Тест</h2><p>Тематичний тест із " + L.homework.test.questions.length + " запитань, " + L.homework.test.minutes + " хв.</p><a class='btn acc' href='#/lesson/" + n + "/hwtest'>Розпочати тест ДЗ</a>" +
      ((p.tests[L.homework.test.id] || []).length ? "<p class='small'>Спроб: " + p.tests[L.homework.test.id].length + ", найкращий результат: " + tb + "%.</p>" : "") + "</section>" +
      "<section class='card'><h2>Частина 4. Робота над помилками</h2><div data-hwerr></div></section>";
    app.innerHTML = html;
    var c = qs("[data-hwp]", app);
    L.homework.practice.forEach(function (e, i) { c.appendChild(renderExercise(e, "homework", "Завдання " + (i + 1))); });
    qsa("[data-th]", app).forEach(function (x) { x.onchange = function () { hw.theory[x.dataset.th] = x.checked; save(); }; });
    qsa("[data-sc]", app).forEach(function (x) { x.onchange = function () { hw.selfcheck[x.dataset.sc] = x.checked; save(); }; });
    qsa("[data-wr]", app).forEach(function (x) { x.oninput = function () { hw.written[x.dataset.wr] = x.value; save(); }; });
    qsa("[data-show]", app).forEach(function (b) { b.onclick = function () { var s = qs("[data-sample='" + b.dataset.show + "']", app); s.hidden = !s.hidden; b.textContent = s.hidden ? "Показати зразок і критерії самоперевірки" : "Сховати зразок"; }; });
    qs("[data-done]", app).onclick = function () { hw.done = !hw.done; hw.doneAt = hw.done ? Date.now() : null; save(); viewHomework(n); };
    renderErrorWork(qs("[data-hwerr]", app), Number(n), true);
    window.scrollTo(0, 0);
  }

  /* ---------- робота над помилками ---------- */
  function asExercise(item, kind) {
    if (kind === "ex") return item;
    var e = { id: item.id, rule: item.rule, q: item.q, explain: item.explain };
    if (item.type === "match") { e.type = "match"; e.items = item.items; e.options = item.options; }
    else { e.type = "single"; e.options = item.options; e.answer = item.answer; }
    return e;
  }
  function renderErrorWork(container, lessonFilter, compact) {
    var p = P(), act = activeErrors(p);
    var rules = act.rules.filter(function (r) { return !lessonFilter || (RULES[r] && RULES[r].lesson === lessonFilter); });
    rules.sort(function (a, b) { return act.by[b].length - act.by[a].length; });
    if (!rules.length) {
      container.innerHTML = "<p>Активних помилок " + (lessonFilter ? "з цього уроку " : "") + "немає. Якщо помилка з’явиться у вправі чи тесті, тут автоматично з’являться завдання для повторення саме цього правила.</p>";
      return;
    }
    container.innerHTML = "<p>Завдання дібрано автоматично за правилами, у яких були помилки. Правильна відповідь на завдання знімає його з переліку помилок.</p>";
    rules.forEach(function (rid) {
      var R = RULES[rid];
      var ids = [];
      act.by[rid].forEach(function (e) { if (ids.indexOf(e.id) < 0 && ITEMS[e.id]) ids.push(e.id); });
      var L = LESSONS[R.lesson], rule = L.rules[R.idx - 1];
      rule.exercises.forEach(function (e) { if (ids.indexOf(e.id) < 0 && ids.length < (compact ? 3 : 5)) ids.push(e.id); });
      var card = h("<div class='" + (compact ? "" : "card") + "' style='margin-bottom:14px'><h3>" + ruleLink(rid) + "</h3><p class='small'>Активних помилок: <b>" + act.by[rid].length + "</b>. Спершу перечитайте правило, потім виконайте завдання.</p><div data-list></div></div>");
      var list = qs("[data-list]", card);
      ids.forEach(function (id, i) { var it = ITEMS[id]; list.appendChild(renderExercise(asExercise(it.item, it.kind), "review", "Повторення " + (i + 1))); });
      container.appendChild(card);
    });
  }
  function viewErrors() {
    header("errors");
    var p = P(), act = activeErrors(p);
    app.innerHTML = "<div class='card'><h1>Робота над помилками</h1><p>Активних помилок: <b>" + act.total + "</b>. Усього записів у журналі: " + p.errors.length + ".</p></div><div data-err></div>" +
      "<div class='card'><h3>Журнал помилок</h3>" + errorLogHtml(p) + "</div>";
    renderErrorWork(qs("[data-err]", app), null, false);
  }
  function errorLogHtml(p) {
    if (!p.errors.length) return "<p class='muted'>Журнал порожній.</p>";
    var srcName = function (s) { return { rule: "вправа після правила", warmup: "актуалізація", practicum: "практикум", homework: "ДЗ", review: "повторення" }[s] || (s.indexOf("quiz") >= 0 ? "міні-тест" : s.indexOf("final") >= 0 ? "підсумковий тест" : s.indexOf("extra") >= 0 ? "додатковий тест" : s.indexOf("hw") >= 0 ? "тест ДЗ" : s); };
    return "<div class='table-wrap'><table><thead><tr><th>Дата</th><th>Правило</th><th>Де</th><th>Втрачено балів</th><th>Стан</th></tr></thead><tbody>" +
      p.errors.slice(-60).reverse().map(function (e) { return "<tr><td>" + dt(e.ts) + "</td><td>" + (RULES[e.rule] ? "Урок " + RULES[e.rule].lesson + ", пр. " + RULES[e.rule].idx : e.rule) + "</td><td>" + srcName(e.source) + "</td><td>" + e.lost + "</td><td>" + (e.resolved ? "<span class='pill ok'>опрацьовано</span>" : "<span class='pill bad'>активна</span>") + "</td></tr>"; }).join("") +
      "</tbody></table></div>" + (p.errors.length > 60 ? "<p class='small muted'>Показано останні 60 записів.</p>" : "");
  }

  /* ---------- результати ---------- */
  function viewResults() {
    header("results");
    var p = P();
    var passed = MAIN.filter(function (l) { return LESSONS[l.n] && lessonCompleted(p, LESSONS[l.n]); });
    var ruleRows = [], subErr = [];
    Object.keys(LESSONS).forEach(function (n) {
      LESSONS[n].rules.forEach(function (r, i) {
        var s = p.rules[r.id] || { right: 0, wrong: 0 }, t = s.right + s.wrong;
        var act = p.errors.filter(function (e) { return e.rule === r.id && !e.resolved; }).length;
        ruleRows.push({ id: r.id, n: n, i: i + 1, title: r.title, right: s.right, wrong: s.wrong, t: t, m: t ? pct(s.right, t) : null, act: act, cnt: p.errors.filter(function (e) { return e.rule === r.id; }).length });
      });
    });
    var hardest = ruleRows.filter(function (r) { return r.wrong > 0; }).sort(function (a, b) { return (a.m - b.m) || (b.wrong - a.wrong); }).slice(0, 3);
    var html = "<div class='card'><h1>Мої результати</h1><p>Профіль: <b>" + esc(p.name) + "</b></p>" +
      "<div class='grid g3'><div><div class='stat'>" + passed.length + " / " + MAIN.length + "</div><div class='muted small'>пройдено уроків (є спроба підсумкового тесту)</div></div>" +
      "<div><div class='stat'>" + avgBest(p) + "</div><div class='muted small'>середній результат (найкращі спроби)</div></div>" +
      "<div><div class='stat'>" + activeErrors(p).total + "</div><div class='muted small'>активних помилок</div></div></div>" +
      "<div class='btn-row'><button class='btn sec' data-json>Експорт JSON</button><button class='btn sec' data-csv>Експорт CSV</button><button class='btn danger' data-reset>Скинути дані профілю</button></div></div>";
    html += "<div class='card'><h2>Результати тестів</h2><div class='table-wrap'><table><thead><tr><th>Урок</th><th>Тест</th><th>Спроб</th><th>Найкращий</th><th>Середній</th><th>Остання спроба</th></tr></thead><tbody>";
    Object.keys(LESSONS).forEach(function (n) {
      var L = LESSONS[n];
      testsOf(L).forEach(function (t) {
        var a = p.tests[t.id] || [];
        var avg = a.length ? Math.round(a.reduce(function (s, x) { return s + x.percent; }, 0) / a.length) + "%" : "—";
        html += "<tr><td>" + n + "</td><td>" + testKindName(L, t.id) + "</td><td>" + a.length + "</td><td>" + (a.length ? bestOf(p, t.id) + "%" : "—") + "</td><td>" + avg + "</td><td>" + (a.length ? a[a.length - 1].score + "/" + a[a.length - 1].max + " (" + a[a.length - 1].percent + "%), " + dt(a[a.length - 1].ts) : "—") + "</td></tr>";
      });
    });
    html += "</tbody></table></div><details class='sub'><summary>Усі спроби</summary>";
    Object.keys(LESSONS).forEach(function (n) {
      var L = LESSONS[n];
      testsOf(L).forEach(function (t) {
        var a = p.tests[t.id] || []; if (!a.length) return;
        html += "<h4>Урок " + n + ": " + testKindName(L, t.id) + "</h4><div class='table-wrap'><table><thead><tr><th>№</th><th>Дата</th><th>Бали</th><th>%</th><th>Час</th></tr></thead><tbody>" +
          a.map(function (r, i) { return "<tr><td>" + (i + 1) + "</td><td>" + dt(r.ts) + "</td><td>" + r.score + "/" + r.max + "</td><td>" + r.percent + "%</td><td>" + mmss(r.duration) + "</td></tr>"; }).join("") + "</tbody></table></div>";
      });
    });
    html += "</details></div>";
    html += "<div class='card'><h2>Найскладніші правила</h2>" + (hardest.length ? "<ol>" + hardest.map(function (r) { return "<li>" + ruleLink(r.id) + " — засвоєння " + r.m + "%, помилок у відповідях: " + r.wrong + "</li>"; }).join("") + "</ol><a class='btn sec' href='#/errors'>Повторити ці правила</a>" : "<p class='muted'>Поки що даних недостатньо.</p>") + "</div>";
    html += "<div class='card'><h2>Засвоєння правил і помилки за підтемами</h2><div class='table-wrap'><table><thead><tr><th>Урок</th><th>Правило (підтема)</th><th>Правильних</th><th>Неправильних</th><th>Засвоєння</th><th>Записів про помилки</th><th>Активних</th></tr></thead><tbody>" +
      ruleRows.map(function (r) { return "<tr><td>" + r.n + "</td><td>" + ruleLink(r.id) + "</td><td>" + r.right + "</td><td>" + r.wrong + "</td><td>" + (r.m === null ? "—" : "<div class='bar' style='min-width:80px'><span style='width:" + r.m + "%'></span></div>" + r.m + "%") + "</td><td>" + r.cnt + "</td><td>" + r.act + "</td></tr>"; }).join("") +
      "</tbody></table></div><p class='small muted'>Засвоєння = частка правильних відповідей серед усіх перевірених відповідей за правилом (вправи й тести).</p></div>";
    html += "<div class='card'><h2>Домашні завдання</h2><div class='table-wrap'><table><thead><tr><th>Урок</th><th>Стан</th><th>Практика</th><th>Тест ДЗ</th></tr></thead><tbody>";
    MAIN.forEach(function (l) {
      var L = LESSONS[l.n];
      if (!L) { html += "<tr><td>" + l.n + "</td><td colspan='3' class='muted'>урок ще не додано</td></tr>"; return; }
      var hw = p.homework[L.id] || {}, pd = L.homework.practice.filter(function (e) { return p.exercises[e.id] && p.exercises[e.id].everOk; }).length, tb = bestOf(p, L.homework.test.id);
      html += "<tr><td>" + l.n + "</td><td>" + (hw.done ? "<span class='pill ok'>виконано</span>" : "<span class='pill off'>не виконано</span>") + "</td><td>" + pd + " / " + L.homework.practice.length + "</td><td>" + (tb === null ? "—" : tb + "%") + "</td></tr>";
    });
    html += "</tbody></table></div></div>";
    app.innerHTML = html;
    qs("[data-json]", app).onclick = function () { exportJSON([store.active]); };
    qs("[data-csv]", app).onclick = function () { exportCSV([store.active]); };
    qs("[data-reset]", app).onclick = function () {
      askConfirm("Видалити всі результати? Дію неможливо скасувати.", "Скинути").then(function (y) {
        if (!y) return; store.profiles[store.active] = newProfile(p.name); save(); toast("Дані профілю скинуто"); viewResults();
      });
    };
  }

  function viewMissing(n) {
    header("lesson");
    var l = COURSE.lessons.filter(function (x) { return String(x.n) === String(n); })[0];
    app.innerHTML = "<div class='card'><h1>" + (l ? "Урок " + l.n + ". " + esc(l.title) : "Сторінку не знайдено") + "</h1><p>" + (l ? "Цей урок ще не додано до сайту. Теми уроку: " + esc(l.topics.join(", ")) + "." : "") + "</p><a class='btn' href='#/'>На головну</a></div>";
  }

  /* ---------- маршрутизація ---------- */
  function route() {
    stopTimers();
    applyTheme();
    var hsh = location.hash.replace(/^#\/?/, "");
    var parts = hsh.split("/").filter(Boolean);
    if (parts[0] === "profiles") { viewProfiles(); return; }
    if (!parts.length) { viewHome(); return; }
    if (parts[0] === "lesson") {
      var n = parts[1];
      if (parts[2] === "test") viewTest(n, "final");
      else if (parts[2] === "extra") viewTest(n, "extra");
      else if (parts[2] === "hwtest") viewTest(n, "hwtest");
      else if (parts[2] === "homework") viewHomework(n);
      else viewLesson(n, parts[2] === "rule" ? parts[3] : null);
      return;
    }
    if (parts[0] === "results") { viewResults(); return; }
    if (parts[0] === "errors") { viewErrors(); return; }
    viewHome();
  }
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
